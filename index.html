<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.7"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/": "https://esm.sh/react-dom@18.3.1/",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "lucide-react": "https://esm.sh/lucide-react@0.474.0?external=react"
        }
    }
    </script>
</head>
<body class="bg-[#0f172a] text-white">
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';

        function App() {
            const [zIndex, setZIndex] = useState([0, 1, 2, 3, 4]);

            const moveFront = (index) => {
                const newZ = [...zIndex];
                const max = Math.max(...newZ);
                newZ[index] = max + 1;
                setZIndex(newZ);
            };

            const images = ['articulos', 'escandallo', 'formatos', 'formatos2', 'marca'];

            return (
                <div className="min-h-screen">
                    <nav className="flex items-center justify-between p-6 sticky top-0 bg-[#0f172a]/80 backdrop-blur-md z-50">
                        <div className="text-2xl font-bold text-blue-400">wilkIA</div>
                        <div className="flex gap-6 text-sm font-medium">
                            {['Inicio', 'Demo', 'Quienes Somos', 'Contacto'].map(item => <a href="#" key={item} className="hover:text-blue-400">{item}</a>)}
                        </div>
                    </nav>

                    <header className="py-20 text-center">
                        <h1 className="text-5xl font-extrabold mb-6">Gestión profesional</h1>
                        <p className="text-slate-400 mb-12">Control total para tu negocio en Jávea</p>

                        <div className="relative h-[500px] w-full max-w-3xl mx-auto mt-20">
                            {images.map((img, i) => (
                                <img 
                                    key={img}
                                    src={`/images/${img}.png`} 
                                    onClick={() => moveFront(i)}
                                    className="absolute w-[600px] shadow-2xl rounded-lg cursor-pointer transition-all duration-500 hover:scale-105"
                                    style={{ left: `${i * 50}px`, top: `${i * 30}px`, zIndex: zIndex[i] }}
                                />
                            ))}
                        </div>
                    </header>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
