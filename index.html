<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.7"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/": "https://esm.sh/react-dom@18.3.1/",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
</head>
<body class="bg-[#0f172a] text-white">
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React from 'react';
        import { createRoot } from 'react-dom/client';

        function App() {
            const images = ['articulos', 'escandallo', 'formatos', 'formatos2', 'marca'];

            return (
                <div className="min-h-screen">
                    {/* Navegación */}
                    <nav className="flex items-center justify-between p-8">
                        <div className="text-3xl font-black text-blue-400 italic">wilkIA</div>
                        <div className="flex gap-8 text-sm font-medium text-slate-300">
                            {['Inicio', 'Demo', 'Quienes Somos', 'Contacto'].map(item => 
                                <a href="#" key={item} className="hover:text-blue-400 transition-all">{item}</a>
                            )}
                        </div>
                    </nav>

                    {/* Hero y Carrusel */}
                    <main className="container mx-auto px-6 py-10 text-center">
                        <section className="mb-20">
                            <h1 className="text-6xl font-extrabold mb-6 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300">
                                Gestión profesional inteligente
                            </h1>
                            <p className="text-xl text-slate-400 max-w-lg mx-auto">Controla tu negocio con la arquitectura más avanzada para hostelería.</p>
                        </section>

                        {/* Carrusel Horizontal */}
                        <div className="flex overflow-x-auto gap-8 pb-10 snap-x snap-mandatory scrollbar-hide">
                            {images.map((img, i) => (
                                <div key={img} className="snap-center shrink-0 w-[800px]">
                                    <div className="p-2 bg-slate-800/50 rounded-2xl border border-white/5 backdrop-blur shadow-2xl">
                                        <img 
                                            src={`/images/${img}.png`} 
                                            alt={img}
                                            className="w-full h-auto rounded-lg"
                                            onError={(e) => e.target.src = 'https://via.placeholder.com/800x500?text=Imagen+No+Cargada'}
                                        />
                                    </div>
                                    <p className="mt-6 text-blue-300 font-semibold uppercase tracking-widest text-sm">{img.replace(/([A-Z])/g, ' $1').trim()}</p>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</body>
</html>
