<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            background-color: #020617; 
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .soft-glow {
            box-shadow: 0 0 80px -20px rgba(59, 130, 246, 0.25);
        }
        .image-container {
            perspective: 2000px;
        }
        .mockup-shadow {
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.5), 0 30px 60px -30px rgba(59, 130, 246, 0.3);
        }
        .glass-nav {
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';

        const FAQItem = ({ q, a }) => {
            const [open, setOpen] = useState(false);
            return (
                <div className="border-b border-white/5 py-4">
                    <button onClick={() => setOpen(!open)} className="w-full flex justify-between items-center text-left py-2">
                        <span className="font-semibold text-slate-200">{q}</span>
                        <span className={`text-blue-500 transition-transform ${open ? 'rotate-180' : ''}`}>▼</span>
                    </button>
                    <div className={`overflow-hidden transition-all duration-300 ${open ? 'max-h-40 mt-4' : 'max-h-0'}`}>
                        <p className="text-slate-400 text-sm leading-relaxed">{a}</p>
                    </div>
                </div>
            );
        };

        function App() {
            return (
                <div className="min-h-screen">
                    {/* NAVEGACIÓN */}
                    <nav className="fixed w-full z-50 glass-nav px-6 py-4">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="text-2xl font-black italic tracking-tighter text-blue-500">wilkIA</div>
                            <div className="hidden md:flex gap-8 text-xs font-bold uppercase tracking-widest text-slate-400">
                                <a href="#solucion" className="hover:text-blue-500 transition-all">Solución</a>
                                <a href="#faq" className="hover:text-blue-500 transition-all">Dudas</a>
                                <a href="#contacto" className="text-white border border-blue-500/50 px-4 py-2 rounded-lg hover:bg-blue-500 transition-all">Contacto</a>
                            </div>
                        </div>
                    </nav>

                    {/* HERO & VISUAL SHOWCASE */}
                    <section id="solucion" className="pt-32 pb-20 px-6 overflow-hidden">
                        <div className="max-w-6xl mx-auto text-center mb-16">
                            <h1 className="text-5xl md:text-8xl font-black mb-6 tracking-tighter leading-none">
                                GESTIÓN <span className="text-blue-600">INTELIGENTE</span>
                            </h1>
                            <p className="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto italic">
                                Diseñado para quienes no tienen tiempo que perder. La potencia de una IA con la simplicidad de un bloc de notas.
                            </p>
                        </div>

                        {/* EL REDISEÑO DE LAS IMÁGENES */}
                        <div className="max-w-5xl mx-auto relative image-container py-10">
                            {/* IMAGEN PRINCIPAL (CENTRAL) */}
                            <div className="relative z-20 transform md:rotate-x-12 transition-transform duration-700 hover:rotate-x-0">
                                <div className="bg-[#1e293b] p-1.5 rounded-[2rem] mockup-shadow">
                                    <img 
                                        src="/images/escandallo.png" 
                                        className="rounded-[1.8rem] w-full h-auto block border border-white/10"
                                        alt="Dashboard Principal"
                                    />
                                </div>
                            </div>

                            {/* DECORACIÓN / IMÁGENES SECUNDARIAS (Sólo en escritorio) */}
                            <div className="hidden md:block absolute -top-10 -left-20 z-10 w-1/2 opacity-40 hover:opacity-100 transition-opacity duration-500">
                                <div className="bg-[#0f172a] p-1 rounded-2xl border border-white/10 rotate-[-10deg] shadow-2xl">
                                    <img src="/images/articulos.png" className="rounded-xl w-full" alt="Artículos" />
                                </div>
                            </div>
                            <div className="hidden md:block absolute -bottom-10 -right-20 z-30 w-1/3 opacity-60 hover:opacity-100 transition-opacity duration-500">
                                <div className="bg-[#0f172a] p-1 rounded-2xl border border-blue-500/30 rotate-[5deg] shadow-2xl">
                                    <img src="/images/marca.png" className="rounded-xl w-full" alt="Métricas" />
                                </div>
                            </div>

                            {/* Glow de fondo */}
                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120%] h-full bg-blue-600/10 blur-[120px] -z-10"></div>
                        </div>

                        {/* Versión móvil - Lista elegante de capturas */}
                        <div className="md:hidden flex flex-col gap-8 mt-12">
                            <div className="space-y-2">
                                <p className="text-blue-500 font-bold text-xs uppercase tracking-widest text-center">Control de Stocks</p>
                                <img src="/images/formatos.png" className="rounded-3xl border border-white/10 shadow-2xl" />
                            </div>
                            <div className="space-y-2">
                                <p className="text-blue-500 font-bold text-xs uppercase tracking-widest text-center">Panel de Métricas</p>
                                <img src="/images/marca.png" className="rounded-3xl border border-white/10 shadow-2xl" />
                            </div>
                        </div>
                    </section>

                    {/* FAQ */}
                    <section id="faq" className="py-20 px-6 max-w-2xl mx-auto">
                        <h2 className="text-2xl font-black mb-10 text-center uppercase">Preguntas</h2>
                        <div className="space-y-2">
                            <FAQItem q="¿Es wilkIA para mi empresa?" a="Si manejas inventario, costes de producción o necesitas reportes claros, wilkIA está hecho para ti." />
                            <FAQItem q="¿Mis datos están seguros?" a="Utilizamos arquitectura Cloudflare con cifrado punto a punto para que tu información sea solo tuya." />
                            <FAQItem q="¿Hay permanencia?" a="No. Creemos tanto en nuestra herramienta que no necesitamos contratos que te aten." />
                        </div>
                    </section>

                    {/* CONTACTO */}
                    <section id="contacto" className="py-24 px-6 bg-gradient-to-t from-blue-900/20 to-transparent">
                        <div className="max-w-4xl mx-auto">
                            <div className="text-center mb-12">
                                <h2 className="text-4xl font-black mb-4">¿TIENES DUDAS?</h2>
                                <p className="text-slate-400">Escríbenos y te contestamos en menos de 24h.</p>
                            </div>
                            <form action="https://formspree.io/f/noreply.wilkia@gmail.com" method="POST" className="grid grid-cols-1 gap-4">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <input name="name" type="text" placeholder="Nombre" required className="bg-white/5 border border-white/10 p-4 rounded-xl focus:border-blue-500 outline-none transition-all" />
                                    <input name="email" type="email" placeholder="Email" required className="bg-white/5 border border-white/10 p-4 rounded-xl focus:border-blue-500 outline-none transition-all" />
                                </div>
                                <textarea name="message" placeholder="Tu mensaje..." rows="4" className="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:border-blue-500 outline-none transition-all"></textarea>
                                <button className="w-full bg-blue-600 hover:bg-blue-700 py-5 rounded-xl font-black uppercase tracking-widest transition-all">Enviar a wilkIA</button>
                            </form>
                        </div>
                    </section>

                    <footer className="py-12 text-center text-slate-600 text-xs font-bold tracking-[0.3em] uppercase">
                        &copy; 2026 wilkIA Cloud / Software de Gestión
                    </footer>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
