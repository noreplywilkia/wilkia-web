<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Next Gen Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        :root { --brand-blue: #2563eb; --brand-dark: #0f172a; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfdfe; color: var(--brand-dark); scroll-behavior: smooth; overflow-x: hidden; }

        /* GRADIENT ORBS */
        .orb { position: absolute; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.4; animation: float 20s infinite alternate; }
        @keyframes float { from { transform: translate(0,0); } to { transform: translate(100px, 50px); } }

        /* REVEAL EFFECT */
        .reveal { opacity: 0; filter: blur(15px); transform: translateY(50px); transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1); }
        .reveal.visible { opacity: 1; filter: blur(0); transform: translateY(0); }

        .glass-nav { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(25px); border-bottom: 1px solid rgba(0,0,0,0.03); }
        
        .bento-card { 
            background: white; border-radius: 2.5rem; border: 1px solid rgba(0,0,0,0.04);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.03); transition: all 0.4s ease;
        }
        .bento-card:hover { transform: translateY(-10px); box-shadow: 0 40px 80px rgba(15, 23, 42, 0.08); }

        .btn-shiny {
            position: relative; overflow: hidden; transition: all 0.3s ease;
        }
        .btn-shiny::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg); transition: 0.5s;
        }
        .btn-shiny:hover::after { left: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';

        const ScrollReveal = ({ children, className = "", delay = 0 }) => {
            const domRef = useRef();
            const [isVisible, setVisible] = useState(false);
            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => { if (entry.isIntersecting) setTimeout(() => setVisible(true), delay); });
                }, { threshold: 0.1 });
                observer.observe(domRef.current);
                return () => observer.unobserve(domRef.current);
            }, [delay]);
            return <div ref={domRef} className={`reveal ${className} ${isVisible ? 'visible' : ''}`}>{children}</div>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('escandallo');

            return (
                <div className="relative">
                    {/* ELEMENTOS DE FONDO */}
                    <div className="orb w-[500px] h-[500px] bg-blue-200 top-[-100px] right-[-100px]"></div>
                    <div className="orb w-[600px] h-[600px] bg-indigo-100 bottom-[20%] left-[-200px]"></div>

                    {/* NAV */}
                    <nav className="fixed w-full z-[100] glass-nav py-5 px-10">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <img src="logo.png" className="h-10" alt="wilkIA" />
                                <img src="logo_nombre.png" className="h-6 opacity-80" alt="wilkIA" />
                            </div>
                            <div className="hidden md:flex items-center gap-12 font-bold text-[10px] uppercase tracking-[0.3em] text-slate-400">
                                <a href="#solucion" className="hover:text-blue-600 transition-colors">Tecnología</a>
                                <a href="#beneficios" className="hover:text-blue-600 transition-colors">Impacto</a>
                                <a href="#contacto" className="btn-shiny bg-blue-600 text-white px-8 py-3 rounded-full shadow-xl shadow-blue-200">Demo Live</a>
                            </div>
                        </div>
                    </nav>

                    {/* HERO SECTION */}
                    <section className="pt-64 pb-32 px-6 overflow-hidden">
                        <ScrollReveal className="text-center max-w-5xl mx-auto">
                            <span className="bg-blue-50 text-blue-600 px-6 py-2 rounded-full text-xs font-black uppercase tracking-widest mb-8 inline-block">Management OS v3.0</span>
                            <h1 className="text-7xl md:text-[110px] font-black tracking-tight leading-[0.8] mb-12 text-slate-900">
                                Tu negocio, <br/>en <span className="text-blue-600 italic">piloto automático.</span>
                            </h1>
                            <p className="text-slate-500 text-xl md:text-2xl max-w-2xl mx-auto font-medium leading-relaxed mb-12">
                                wilkIA conecta tus datos para ofrecerte una visión cristalina de tus márgenes en tiempo real.
                            </p>
                            <div className="flex flex-col md:flex-row gap-6 justify-center">
                                <button className="btn-shiny bg-slate-900 text-white px-10 py-5 rounded-2xl font-bold text-lg shadow-2xl">Empezar ahora</button>
                                <button className="px-10 py-5 rounded-2xl font-bold text-lg border-2 border-slate-200 hover:bg-slate-50 transition-all">Ver Roadmap</button>
                            </div>
                        </ScrollReveal>

                        {/* MOCKUP DINÁMICO */}
                        <ScrollReveal delay={300} id="solucion" className="max-w-6xl mx-auto mt-32 relative">
                            <div className="absolute -inset-4 bg-gradient-to-r from-blue-500 to-indigo-500 rounded-[3.5rem] blur-2xl opacity-10"></div>
                            <div className="bento-card relative flex flex-col md:flex-row h-[700px] overflow-hidden bg-white/80 backdrop-blur-md">
                                <div className="w-full md:w-80 bg-slate-50/50 border-r border-slate-100 p-10 flex flex-col">
                                    <div className="space-y-4">
                                        {['Escandallo', 'Articulos', 'Marca', 'Formatos'].map((m) => (
                                            <button 
                                                key={m} 
                                                onClick={() => setActiveTab(m.toLowerCase())}
                                                className={`w-full text-left px-6 py-4 rounded-2xl font-extrabold text-sm transition-all ${activeTab === m.toLowerCase() ? 'bg-white text-blue-600 shadow-xl shadow-blue-100 scale-105' : 'text-slate-400 hover:text-slate-600'}`}
                                            >
                                                {m}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="mt-auto bg-blue-600 p-6 rounded-[2rem] text-white">
                                        <p className="text-[10px] font-black uppercase opacity-60 mb-2">Insight del día</p>
                                        <p className="text-sm font-bold leading-snug">"Has reducido un 4% el desperdicio en cárnicos."</p>
                                    </div>
                                </div>
                                <div className="flex-1 p-12 flex items-center justify-center bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                                    <img 
                                        src={`/images/${activeTab}.png`} 
                                        className="max-w-full max-h-full rounded-3xl shadow-[0_50px_100px_-15px_rgba(0,0,0,0.2)] transition-all duration-700 hover:scale-[1.02]" 
                                        alt="Dashboard" 
                                    />
                                </div>
                            </div>
                        </ScrollReveal>
                    </section>

                    {/* SECCIÓN "BENEFICIOS BENTO" */}
                    <section id="beneficios" className="py-32 px-6 max-w-7xl mx-auto">
                        <div className="grid md:grid-cols-3 gap-8">
                            <ScrollReveal className="bento-card p-10 md:col-span-2 bg-gradient-to-br from-blue-600 to-indigo-700 text-white">
                                <h3 className="text-4xl font-black mb-6 tracking-tighter italic">Velocidad de decisión</h3>
                                <p className="text-blue-100 text-lg font-medium max-w-md">Analiza el rendimiento de toda tu carta en segundos, no en días. wilkIA procesa miles de variantes para darte el precio exacto.</p>
                            </ScrollReveal>
                            <ScrollReveal delay={100} className="bento-card p-10 flex flex-col justify-between">
                                <div className="text-5xl">📊</div>
                                <div>
                                    <h3 className="text-2xl font-black mb-2 tracking-tight">Precisión Total</h3>
                                    <p className="text-slate-400 font-medium">Control de stock gramo a gramo.</p>
                                </div>
                            </ScrollReveal>
                        </div>
                    </section>

                    {/* CONTACTO DARK MODE */}
                    <section id="contacto" className="py-40 px-6">
                        <div className="max-w-7xl mx-auto bg-slate-900 rounded-[4rem] p-12 md:p-24 overflow-hidden relative">
                            <div className="absolute top-0 right-0 w-96 h-96 bg-blue-600 blur-[150px] opacity-20"></div>
                            <ScrollReveal className="grid lg:grid-cols-2 gap-20 relative z-10">
                                <div>
                                    <h2 className="text-6xl md:text-7xl font-black text-white leading-none tracking-tighter mb-10">
                                        ¿Listo para <br/><span className="text-blue-500">despegar?</span>
                                    </h2>
                                    <p className="text-slate-400 text-xl font-medium mb-12">Estamos buscando empresas ambiciosas que quieran transformar su caos en datos accionables.</p>
                                    <div className="flex gap-4">
                                        <div className="h-12 w-12 bg-white/10 rounded-full flex items-center justify-center text-white">✓</div>
                                        <div className="h-12 w-12 bg-white/10 rounded-full flex items-center justify-center text-white">✓</div>
                                        <div className="h-12 w-12 bg-white/10 rounded-full flex items-center justify-center text-white">✓</div>
                                    </div>
                                </div>
                                <form action="https://formspree.io/f/noreply.wilkia@gmail.com" method="POST" className="space-y-4">
                                    <input name="name" placeholder="Tu nombre" className="w-full bg-white/5 border border-white/10 p-6 rounded-3xl text-white outline-none focus:border-blue-500 transition-all" required />
                                    <input name="email" type="email" placeholder="Email corporativo" className="w-full bg-white/5 border border-white/10 p-6 rounded-3xl text-white outline-none focus:border-blue-500 transition-all" required />
                                    <textarea name="message" rows="4" placeholder="Háblanos de tu negocio..." className="w-full bg-white/5 border border-white/10 p-6 rounded-3xl text-white outline-none focus:border-blue-500 transition-all"></textarea>
                                    <button className="btn-shiny w-full bg-blue-600 text-white p-6 rounded-3xl font-black uppercase tracking-widest text-sm shadow-2xl shadow-blue-600/30">
                                        Solicitar Diagnóstico Gratis
                                    </button>
                                </form>
                            </ScrollReveal>
                        </div>
                    </section>

                    {/* FOOTER REFINADO */}
                    <footer className="py-20 px-6 text-center">
                        <div className="flex justify-center items-center gap-4 mb-10">
                            <img src="logo.png" className="h-12" alt="wilkIA" />
                            <img src="logo_nombre.png" className="h-7 opacity-50" alt="wilkIA" />
                        </div>
                        <nav className="flex justify-center gap-10 font-black text-[10px] uppercase tracking-[0.4em] text-slate-300 mb-10">
                            <a href="#" className="hover:text-blue-600">Privacy</a>
                            <a href="#" className="hover:text-blue-600">Terms</a>
                            <a href="#" className="hover:text-blue-600">Security</a>
                        </nav>
                        <p className="text-slate-200 text-xs font-bold">&copy; 2026 WILKIA CLOUD SYSTEMS S.L.</p>
                    </footer>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
