<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión de Próxima Generación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfdfe; color: #0f172a; scroll-behavior: smooth; overflow-x: hidden; }

        .orb { position: absolute; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.3; animation: float 20s infinite alternate; }
        @keyframes float { from { transform: translate(0,0); } to { transform: translate(100px, 50px); } }

        .reveal { opacity: 0; filter: blur(15px); transform: translateY(40px); transition: all 1s cubic-bezier(0.19, 1, 0.22, 1); }
        .reveal.visible { opacity: 1; filter: blur(0); transform: translateY(0); }

        .glass-nav { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(25px); border-bottom: 1px solid rgba(0,0,0,0.03); }
        
        .bento-card { 
            background: white; border-radius: 2.5rem; border: 1px solid rgba(0,0,0,0.04);
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.02); transition: all 0.4s ease;
        }
        .bento-card:hover { transform: translateY(-5px); box-shadow: 0 30px 60px rgba(15, 23, 42, 0.06); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';

        const ScrollReveal = ({ children, className = "", delay = 0 }) => {
            const domRef = useRef();
            const [isVisible, setVisible] = useState(false);
            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => { if (entry.isIntersecting) setTimeout(() => setVisible(true), delay); });
                }, { threshold: 0.1 });
                observer.observe(domRef.current);
                return () => observer.unobserve(domRef.current);
            }, [delay]);
            return <div ref={domRef} className={`reveal ${className} ${isVisible ? 'visible' : ''}`}>{children}</div>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('escandallo');

            return (
                <div className="relative">
                    <div className="orb w-[500px] h-[500px] bg-blue-200 top-[-100px] right-[-100px]"></div>
                    <div className="orb w-[600px] h-[600px] bg-indigo-100 bottom-[20%] left-[-200px]"></div>

                    {/* NAV */}
                    <nav className="fixed w-full z-[100] glass-nav py-4 px-8">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <img src="logo.png" className="h-10" alt="Logo" />
                                <img src="logo_nombre.png" className="h-6" alt="wilkIA" />
                            </div>
                            <div className="hidden md:flex items-center gap-10 font-bold text-[10px] uppercase tracking-[0.3em] text-slate-400">
                                <a href="#nosotros" className="hover:text-blue-600 transition-colors">Nosotros</a>
                                <a href="#solucion" className="hover:text-blue-600 transition-colors">Software</a>
                                <a href="#faq" className="hover:text-blue-600 transition-colors">FAQ</a>
                                <a href="#contacto" className="bg-blue-600 text-white px-6 py-2 rounded-full shadow-lg shadow-blue-200">Contacto</a>
                            </div>
                        </div>
                    </nav>

                    {/* HERO */}
                    <section className="pt-56 pb-20 px-6">
                        <ScrollReveal className="text-center max-w-5xl mx-auto">
                            <h1 className="text-7xl md:text-9xl font-black tracking-tighter leading-[0.85] mb-10">
                                Datos que <br/><span className="text-blue-600 italic">deciden por ti.</span>
                            </h1>
                            <p className="text-slate-500 text-xl md:text-2xl max-w-2xl mx-auto font-medium">
                                El sistema operativo para empresas que buscan rentabilidad real sin fricciones.
                            </p>
                        </ScrollReveal>

                        {/* APP PREVIEW */}
                        <ScrollReveal delay={200} id="solucion" className="max-w-6xl mx-auto mt-24 bento-card flex flex-col md:flex-row h-[650px] overflow-hidden">
                            <div className="w-full md:w-72 bg-slate-50 border-r border-slate-100 p-8 flex flex-col gap-2">
                                {['Escandallo', 'Articulos', 'Marca', 'Formatos'].map((m) => (
                                    <button 
                                        key={m} 
                                        onClick={() => setActiveTab(m.toLowerCase())}
                                        className={`text-left px-6 py-4 rounded-2xl font-black text-sm transition-all ${activeTab === m.toLowerCase() ? 'bg-white text-blue-600 shadow-xl' : 'text-slate-400 hover:text-slate-600'}`}
                                    >
                                        {m}
                                    </button>
                                ))}
                            </div>
                            <div className="flex-1 bg-white p-10 flex items-center justify-center">
                                <img src={`/images/${activeTab}.png`} className="max-w-full max-h-full rounded-2xl shadow-2xl border border-slate-100 transition-opacity duration-500" alt="Preview" />
                            </div>
                        </ScrollReveal>
                    </section>

                    {/* QUIENES SOMOS */}
                    <section id="nosotros" className="py-32 px-6">
                        <ScrollReveal className="max-w-4xl mx-auto text-center">
                            <span className="text-blue-600 font-black uppercase tracking-[0.4em] text-[10px]">Sobre nosotros</span>
                            <h2 className="text-5xl font-black tracking-tight mt-6 mb-8 italic">No somos solo software, somos tu equipo de datos.</h2>
                            <p className="text-slate-500 text-lg leading-relaxed font-medium">
                                En wilkIA nacimos de la frustración de ver cómo grandes negocios perdían margen por falta de visibilidad operativa. Hemos unido ingeniería de datos avanzada con una interfaz que cualquiera puede usar. Nuestra misión es democratizar la eficiencia.
                            </p>
                        </ScrollReveal>
                    </section>

                    {/* FAQ SECTION */}
                    <section id="faq" className="py-32 px-6 bg-slate-50/50">
                        <div className="max-w-4xl mx-auto">
                            <h2 className="text-4xl font-black mb-16 text-center italic tracking-tight">Preguntas Frecuentes</h2>
                            <div className="space-y-6">
                                {[
                                    {q: "¿Es difícil de implementar?", a: "Para nada. wilkIA se integra con tus sistemas actuales en menos de 48 horas laborales."},
                                    {q: "¿Cómo ayuda la IA exactamente?", a: "Predice desviaciones de coste basadas en el mercado y tus mermas históricas automáticamente."},
                                    {q: "¿Puedo acceder desde el móvil?", a: "Sí, es 100% responsive y accesible desde cualquier dispositivo con internet."}
                                ].map((item, i) => (
                                    <ScrollReveal key={i} delay={i*100} className="bg-white p-8 rounded-3xl border border-slate-100">
                                        <h4 className="text-lg font-bold mb-3">{item.q}</h4>
                                        <p className="text-slate-500 font-medium">{item.a}</p>
                                    </ScrollReveal>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* CONTACTO */}
                    <section id="contacto" className="py-40 px-6 bg-[#0f172a] relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
                        <ScrollReveal className="max-w-6xl mx-auto grid lg:grid-cols-2 gap-20 relative z-10">
                            <div>
                                <h2 className="text-7xl font-black text-white leading-none tracking-tighter mb-8 italic">Impulsa tu <br/><span className="text-blue-500">margen.</span></h2>
                                <p className="text-slate-400 text-xl font-medium mb-10">Rellena el formulario y te daremos acceso a una demo personalizada.</p>
                            </div>
                            <form action="https://formspree.io/f/noreply.wilkia@gmail.com" method="POST" className="bg-white/5 backdrop-blur-md p-12 rounded-[3rem] border border-white/10 space-y-6">
                                <input name="name" placeholder="Nombre" className="w-full bg-white/10 border border-white/10 p-5 rounded-2xl text-white outline-none focus:border-blue-500" required />
                                <input name="email" type="email" placeholder="Email" className="w-full bg-white/10 border border-white/10 p-5 rounded-2xl text-white outline-none focus:border-blue-500" required />
                                <textarea name="message" rows="3" placeholder="Mensaje" className="w-full bg-white/10 border border-white/10 p-5 rounded-2xl text-white outline-none focus:border-blue-500"></textarea>
                                <button className="w-full bg-blue-600 text-white p-6 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-500 transition-all shadow-xl shadow-blue-600/20">Enviar Solicitud</button>
                            </form>
                        </ScrollReveal>
                    </section>

                    {/* FOOTER */}
                    <footer className="py-20 px-8 text-center bg-white border-t border-slate-100">
                        <div className="flex justify-center items-center gap-4 mb-10">
                            <img src="logo.png" className="h-12" alt="Logo" />
                            <img src="logo_nombre.png" className="h-7 opacity-50" alt="wilkIA" />
                        </div>
                        <p className="text-slate-300 text-[10px] font-black uppercase tracking-[0.4em]">© 2026 WILKIA SYSTEMS — EL FUTURO DE LA GESTIÓN</p>
                    </footer>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
