<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.7"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/": "https://esm.sh/react-dom@18.3.1/",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "lucide-react": "https://esm.sh/lucide-react@0.474.0?external=react"
        }
    }
    </script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import { Menu, X } from 'lucide-react';

        function App() {
            const [isMenuOpen, setIsMenuOpen] = React.useState(false);

            return (
                <div className="min-h-screen">
                    <nav className="flex items-center justify-between p-6 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
                        <div className="text-2xl font-bold tracking-tighter text-blue-500">wilkIA</div>
                        <div className="hidden md:flex gap-8 font-medium">
                            {['Inicio', 'Demo', 'Quienes Somos', 'Contacto'].map((item) => (
                                <a key={item} href="#" className="hover:text-blue-400 transition-colors">{item}</a>
                            ))}
                        </div>
                        <button className="md:hidden" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                            {isMenuOpen ? <X /> : <Menu />}
                        </button>
                    </nav>
                    
                    <header className="container mx-auto px-6 py-20 text-center">
                        <h1 className="text-6xl font-extrabold mb-6">Gestión inteligente para tu negocio</h1>
                        <p className="text-xl text-slate-400 mb-10 max-w-2xl mx-auto">wilkIA simplifica el control operativo de tu empresa en Jávea con una interfaz moderna y eficiente.</p>
                        <button className="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-lg font-bold transition-all">Solicitar Demo</button>
                    </header>
                </div>
            );
        }

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
