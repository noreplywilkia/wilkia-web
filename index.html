<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>wilkIA | Management OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        :root { --accent: #2563eb; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020617; 
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- ESTILOS DEL BANNER DE COOKIES (CORREGIDO) --- */
        .cookie-banner {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            border-radius: 1.5rem;
            z-index: 9999;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: block; /* Se muestra por defecto */
        }
        
        .cookie-banner.hidden { display: none; }

        .cookie-content h3 { font-weight: 800; font-size: 1.25rem; margin-bottom: 8px; color: white; }
        .cookie-content p { font-size: 0.875rem; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }

        .cookie-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
        .cookie-buttons button {
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
        }

        #accept-cookies { background: var(--accent); color: white; }
        #accept-cookies:hover { background: #3b82f6; }
        #reject-cookies { background: rgba(255,255,255,0.05); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); }
        #config-cookies { color: #94a3b8; text-decoration: underline; font-size: 0.7rem; margin-left: auto; }

        /* --- ESTILOS MODAL CONFIGURACIÓN --- */
        .cookie-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }
        .cookie-modal-content {
            background: #0f172a;
            padding: 32px;
            border-radius: 2rem;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .cookie-option { margin-bottom: 15px; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none !important; }

        /* Resto de tus estilos... */
        .brand-fix { filter: drop-shadow(0 0 12px rgba(255,255,255,0.3)) brightness(1.2); }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .glass-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
        }
        .tab-btn.active { background: var(--accent); color: white; }
    </style>
</head>
<body>

    <!-- COOKIE BANNER -->
    <div id="cookie-banner" class="cookie-banner">
        <div class="cookie-content">
            <h3>Cookies</h3>
            <p>Utilizamos cookies propias y de terceros para mejorar la experiencia, analizar el tráfico y personalizar contenido.</p>
            <div class="cookie-buttons">
                <button id="accept-cookies">Aceptar todas</button>
                <button id="reject-cookies">Rechazar</button>
                <button id="config-cookies">Configurar</button>
            </div>
        </div>
    </div>

    <!-- COOKIE MODAL (CONFIGURACIÓN) -->
    <div id="cookie-modal" class="cookie-modal hidden">
        <div class="cookie-modal-content">
            <h2 class="text-xl font-bold mb-4">Configuración</h2>
            <div class="cookie-option">
                <label class="flex items-center gap-2 font-bold"><input type="checkbox" checked disabled> Necesarias</label>
            </div>
            <div class="cookie-option">
                <label class="flex items-center gap-2"><input type="checkbox" id="analytics-cookies"> Analíticas</label>
            </div>
            <div class="cookie-buttons mt-6">
                <button id="save-preferences" class="bg-blue-600 text-white w-full py-3 rounded-xl">Guardar</button>
                <button id="close-modal" class="text-slate-400 text-xs w-full">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="fixed w-full z-[100] py-4 px-6 bg-slate-950/80 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2 md:gap-3">
                <img src="images/logo.png" class="h-9 md:h-11 w-auto brand-fix" alt="Logo">
                <img src="images/logo_nombre.png" class="h-5 md:h-6 w-auto brand-fix" alt="wilkIA">
            </div>
            <div class="hidden lg:flex gap-10 font-bold text-[10px] uppercase tracking-[0.4em] text-slate-400">
                <a href="#solucion" class="hover:text-blue-400 transition-all">Software</a>
                <a href="#proceso" class="hover:text-blue-400 transition-all">Método</a>
                <a href="#contacto" class="hover:text-blue-400 transition-all">Contacto</a>
                <a href="#faq" class="hover:text-blue-400 transition-all">FAQ</a>
            </div>
            <a href="#contacto" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-full font-bold text-[10px] uppercase tracking-widest transition-all">
                Demo Gratuita
            </a>
        </div>
    </nav>

    <!-- El resto de tu contenido (Hero, Métricas, etc.) sigue aquí igual que antes... -->
    <section class="pt-56 pb-24 px-6 text-center relative overflow-hidden">
        <div class="max-w-5xl mx-auto reveal">
            <h1 class="text-6xl md:text-[115px] font-extrabold tracking-tighter leading-[0.85] mb-12">
                Control de <br><span class="italic text-blue-500">márgenes.</span>
            </h1>
        </div>
    </section>

    <!-- SCRIPTS -->
    <script>
        // Lógica de Cookies
        const banner = document.getElementById('cookie-banner');
        const modal = document.getElementById('cookie-modal');

        document.getElementById('accept-cookies').onclick = () => banner.classList.add('hidden');
        document.getElementById('reject-cookies').onclick = () => banner.classList.add('hidden');
        document.getElementById('config-cookies').onclick = () => modal.classList.remove('hidden');
        document.getElementById('close-modal').onclick = () => modal.classList.add('hidden');
        document.getElementById('save-preferences').onclick = () => {
            modal.classList.add('hidden');
            banner.classList.add('hidden');
        };

        // Animación Reveal al Scroll
        const observer = new IntersectionObserver(entries => {
            entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('active'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        // Navegación de Pestañas
        function tab(name, btn) {
            const img = document.getElementById('view');
            img.style.opacity = '0';
            setTimeout(() => {
                img.src = `images/${name}.png`;
                img.style.opacity = '1';
            }, 200);
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
