<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        html, body {
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        .perspective-1000 { perspective: 1000px; }
        .glass-nav {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-[#0f172a] text-white">
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';

        function FAQItem({ q, a }) {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="border-b border-white/10 py-4">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full flex justify-between items-center text-left focus:outline-none">
                        <span className="text-lg font-medium">{q}</span>
                        <span className="text-blue-400 text-2xl">{isOpen ? '−' : '+'}</span>
                    </button>
                    {isOpen && <p className="mt-2 text-slate-400 leading-relaxed">{a}</p>}
                </div>
            );
        }

        function App() {
            const images = ['articulos', 'escandallo', 'formatos', 'formatos2', 'marca'];
            const [activeIndex, setActiveIndex] = useState(2);
            const [isMobile, setIsMobile] = useState(false);

            useEffect(() => {
                const checkMobile = () => setIsMobile(window.innerWidth < 768);
                checkMobile();
                window.addEventListener('resize', checkMobile);
                return () => window.removeEventListener('resize', checkMobile);
            }, []);

            return (
                <div className="min-h-screen flex flex-col items-center">
                    {/* NAV FLOTANTE */}
                    <nav className="w-full flex flex-col md:flex-row items-center justify-between p-6 md:p-8 gap-4 sticky top-0 glass-nav z-50">
                        <div className="text-3xl font-black text-blue-400 italic">wilkIA</div>
                        <div className="flex flex-wrap justify-center gap-4 md:gap-8 text-xs md:text-sm font-medium text-slate-300">
                            <a href="#" className="hover:text-blue-400 transition-all">Inicio</a>
                            <a href="#demo" className="hover:text-blue-400 transition-all">Demo</a>
                            <a href="#nosotros" className="hover:text-blue-400 transition-all">Quienes Somos</a>
                            <a href="#faq" className="hover:text-blue-400 transition-all">FAQ</a>
                            <a href="#contacto" className="hover:text-blue-400 transition-all">Contacto</a>
                        </div>
                    </nav>

                    {/* SECCIÓN DEMO CON CARRUSEL (El diseño original) */}
                    <section id="demo" className="flex flex-col items-center justify-center w-full py-16">
                        <h1 className="text-3xl md:text-5xl font-extrabold mb-8 md:mb-16 text-center px-4 uppercase tracking-tighter italic">Experiencia <span className="text-blue-400">wilkIA</span></h1>
                        
                        <div className="relative flex items-center justify-center w-full h-[350px] md:h-[500px] perspective-1000 overflow-hidden">
                            {images.map((img, i) => {
                                const offset = i - activeIndex;
                                const isCenter = i === activeIndex;
                                const translateX = isMobile ? offset * 70 : offset * 350;

                                return (
                                    <div 
                                        key={img}
                                        onClick={() => setActiveIndex(i)}
                                        className={`absolute transition-all duration-700 ease-in-out cursor-pointer ${isCenter ? 'z-20 scale-100 opacity-100' : 'z-10 scale-75 opacity-40'}`}
                                        style={{
                                            transform: `translateX(${translateX}px) ${isCenter ? '' : 'rotateY(' + (offset > 0 ? -25 : 25) + 'deg)'}`,
                                            width: isMobile ? '70%' : 'auto'
                                        }}
                                    >
                                        <img 
                                            src={`/images/${img}.png`} 
                                            alt={img}
                                            className="w-full max-w-[800px] h-auto rounded-xl shadow-2xl border border-white/10 bg-[#1e293b]"
                                        />
                                    </div>
                                );
                            })}
                        </div>
                        <p className="mt-12 text-slate-400 text-sm text-center px-6 italic">
                            {isMobile ? "Toca las pantallas laterales" : "Haz clic en las pantallas laterales para navegar"}
                        </p>
                    </section>

                    {/* QUIENES SOMOS */}
                    <section id="nosotros" className="w-full max-w-5xl px-6 py-20 border-t border-white/5">
                        <div className="text-center mb-12">
                            <h2 className="text-4xl font-bold italic text-blue-400 uppercase tracking-tight">Quiénes Somos</h2>
                        </div>
                        <div className="grid md:grid-cols-2 gap-12 items-center text-slate-300">
                            <p className="text-lg leading-relaxed">
                                En <span className="text-white font-bold">wilkIA</span>, desarrollamos software de gestión avanzada pensado para la eficiencia. Nuestro objetivo es que dediques menos tiempo a la administración y más a hacer crecer tu negocio.
                            </p>
                            <p className="text-lg leading-relaxed border-l-2 border-blue-500 pl-6 italic">
                                "La inteligencia aplicada a la gestión diaria. Sencillo, potente y siempre en la nube."
                            </p>
                        </div>
                    </section>

                    {/* FAQ */}
                    <section id="faq" className="w-full max-w-3xl px-6 py-20 border-t border-white/5">
                        <h2 className="text-3xl font-bold mb-10 text-center uppercase italic">Preguntas Frecuentes</h2>
                        <FAQItem q="¿Es seguro wilkIA?" a="Tus datos están protegidos en la nube de Cloudflare con encriptación de última generación." />
                        <FAQItem q="¿Puedo usarlo en el móvil?" a="Sí, la plataforma es 100% responsive y accesible desde cualquier dispositivo." />
                        <FAQItem q="¿Necesito instalar algo?" a="No. Es una solución Cloud, solo necesitas una conexión a internet." />
                    </section>

                    {/* CONTACTO */}
                    <section id="contacto" className="w-full max-w-4xl px-6 py-20 border-t border-white/5">
                        <div className="bg-[#1e293b] rounded-2xl p-8 md:p-12 shadow-2xl border border-white/10">
                            <h2 className="text-3xl font-bold mb-4 text-center">Contacta con nosotros</h2>
                            <p className="text-slate-400 text-center mb-10">Envíanos un mensaje y te responderemos a la mayor brevedad.</p>

                            <form action="https://formspree.io/f/noreply.wilkia@gmail.com" method="POST" className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <input type="text" name="name" placeholder="Tu nombre" required className="bg-[#0f172a] border border-slate-700 rounded-lg p-3 focus:border-blue-400 outline-none" />
                                    <input type="email" name="email" placeholder="Tu email" required className="bg-[#0f172a] border border-slate-700 rounded-lg p-3 focus:border-blue-400 outline-none" />
                                </div>
                                <textarea name="message" rows="4" placeholder="¿Cómo podemos ayudarte?" required className="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-3 focus:border-blue-400 outline-none"></textarea>
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-lg transition-all uppercase tracking-widest">Enviar Mensaje</button>
                            </form>
                        </div>
                    </section>

                    <footer className="w-full py-10 border-t border-white/5 text-center text-slate-500 text-sm">
                        &copy; 2026 wilkIA. Gestión Inteligente.
                    </footer>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
