<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión Inteligente para Empresas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        html, body { max-width: 100%; overflow-x: hidden; margin: 0; padding: 0; scroll-behavior: smooth; }
        .perspective-1000 { perspective: 1000px; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-[#0f172a] text-white font-sans">
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';

        function App() {
            const images = ['articulos', 'escandallo', 'formatos', 'formatos2', 'marca'];
            const [activeIndex, setActiveIndex] = useState(2);
            const [isMobile, setIsMobile] = useState(false);

            useEffect(() => {
                const checkMobile = () => setIsMobile(window.innerWidth < 768);
                checkMobile();
                window.addEventListener('resize', checkMobile);
                return () => window.removeEventListener('resize', checkMobile);
            }, []);

            return (
                <div className="min-h-screen flex flex-col items-center">
                    {/* NAVEGACIÓN */}
                    <nav className="w-full flex flex-col md:flex-row items-center justify-between p-6 md:p-8 gap-4 sticky top-0 bg-[#0f172a]/90 backdrop-blur-md z-50 border-b border-white/5">
                        <div className="text-3xl font-black text-blue-400 italic tracking-tighter">wilkIA</div>
                        <div className="flex flex-wrap justify-center gap-4 md:gap-8 text-xs md:text-sm font-medium text-slate-300">
                            <a href="#" className="hover:text-blue-400 transition-all">Inicio</a>
                            <a href="#funcionalidades" className="hover:text-blue-400 transition-all">Funciones</a>
                            <a href="#demo" className="hover:text-blue-400 transition-all">Demo</a>
                            <a href="#nosotros" className="hover:text-blue-400 transition-all">Nosotros</a>
                            <a href="#contacto" className="px-4 py-2 bg-blue-600 rounded-full text-white hover:bg-blue-500 transition-all">Probar ahora</a>
                        </div>
                    </nav>

                    {/* HERO & CAROUSEL */}
                    <section id="demo" className="w-full py-16 flex flex-col items-center">
                        <div className="text-center px-6 mb-12">
                            <span className="text-blue-400 font-bold tracking-widest text-xs uppercase">El futuro de la gestión</span>
                            <h1 className="text-4xl md:text-6xl font-extrabold mt-2 mb-6">Software de gestión <br/><span className="text-blue-400">potenciado por IA</span></h1>
                            <p className="text-slate-400 max-w-2xl mx-auto text-lg">Optimiza tus escandallos, controla tu stock en tiempo real y toma decisiones basadas en datos con wilkIA.</p>
                        </div>
                        
                        <div className="relative flex items-center justify-center w-full h-[350px] md:h-[500px] perspective-1000 overflow-hidden">
                            {images.map((img, i) => {
                                const offset = i - activeIndex;
                                const isCenter = i === activeIndex;
                                const translateX = isMobile ? offset * 70 : offset * 350;
                                return (
                                    <div key={img} onClick={() => setActiveIndex(i)}
                                        className={`absolute transition-all duration-700 ease-in-out cursor-pointer ${isCenter ? 'z-20 scale-100 opacity-100' : 'z-10 scale-75 opacity-40'}`}
                                        style={{ transform: `translateX(${translateX}px) ${isCenter ? '' : 'rotateY(' + (offset > 0 ? -25 : 25) + 'deg)'}`, width: isMobile ? '70%' : 'auto' }}>
                                        <img src={`/images/${img}.png`} alt={img} className="w-full max-w-[800px] h-auto rounded-xl shadow-2xl border border-white/10 bg-[#1e293b]" />
                                    </div>
                                );
                            })}
                        </div>
                    </section>

                    {/* SECCIÓN DE ESTADÍSTICAS */}
                    <section className="w-full py-12 bg-blue-600">
                        <div className="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-8 text-center">
                            <div><p className="text-3xl md:text-4xl font-black">+40%</p><p className="text-blue-100 text-sm">Eficiencia operativa</p></div>
                            <div><p className="text-3xl md:text-4xl font-black">Real-Time</p><p className="text-blue-100 text-sm">Sincronización Cloud</p></div>
                            <div><p className="text-3xl md:text-4xl font-black">24/7</p><p className="text-blue-100 text-sm">Acceso remoto</p></div>
                            <div><p className="text-3xl md:text-4xl font-black">0€</p><p className="text-blue-100 text-sm">Costes de servidor</p></div>
                        </div>
                    </section>

                    {/* SECCIÓN FUNCIONALIDADES (BENTO GRID) */}
                    <section id="funcionalidades" className="w-full max-w-6xl px-6 py-24">
                        <h2 className="text-3xl md:text-4xl font-bold mb-12 text-center text-blue-400 uppercase tracking-tighter italic">Todo lo que tu empresa necesita</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="md:col-span-2 glass p-8 rounded-3xl border border-white/5 hover:border-blue-500/50 transition-all">
                                <h3 className="text-2xl font-bold mb-4">Gestión de Escandallos</h3>
                                <p className="text-slate-400">Calcula con precisión milimétrica el coste de tus productos. wilkIA analiza variaciones de precios en tiempo real para proteger tu margen de beneficio.</p>
                                <div className="mt-6 h-32 bg-gradient-to-r from-blue-500/20 to-transparent rounded-xl flex items-center justify-center italic text-blue-300">Vista detallada de ingredientes y mermas</div>
                            </div>
                            <div className="glass p-8 rounded-3xl border border-white/5 hover:border-blue-500/50 transition-all">
                                <h3 className="text-2xl font-bold mb-4">Stock Inteligente</h3>
                                <p className="text-slate-400">Alertas automáticas de rotura de stock y sugerencias de compra basadas en demanda histórica.</p>
                            </div>
                            <div className="glass p-8 rounded-3xl border border-white/5 hover:border-blue-500/50 transition-all">
                                <h3 className="text-2xl font-bold mb-4">Multiformato</h3>
                                <p className="text-slate-400">Ventas por unidad, peso o packs. El software se adapta a tu forma de vender.</p>
                            </div>
                            <div className="md:col-span-2 glass p-8 rounded-3xl border border-white/5 hover:border-blue-500/50 transition-all">
                                <h3 className="text-2xl font-bold mb-4">Análisis y Reportes</h3>
                                <p className="text-slate-400">Gráficas visuales para entender dónde se va el dinero. Exportación a PDF/Excel en un solo clic.</p>
                            </div>
                        </div>
                    </section>

                    {/* QUIÉNES SOMOS */}
                    <section id="nosotros" className="w-full max-w-6xl px-6 py-20 border-t border-white/5">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
                            <div>
                                <h2 className="text-4xl font-bold mb-6 italic text-blue-400 tracking-tighter">SOBRE NOSOTROS</h2>
                                <p className="text-slate-300 leading-relaxed text-lg mb-6">
                                    En <span className="text-white font-bold">wilkIA</span> no solo vendemos software; diseñamos soluciones para humanos que gestionan empresas.
                                </p>
                                <ul className="space-y-4">
                                    <li className="flex items-center gap-3"><span className="text-blue-500">✔</span> Tecnología Cloud encriptada</li>
                                    <li className="flex items-center gap-3"><span className="text-blue-500">✔</span> Soporte técnico especializado</li>
                                    <li className="flex items-center gap-3"><span className="text-blue-500">✔</span> Actualizaciones semanales</li>
                                </ul>
                            </div>
                            <div className="relative">
                                <div className="absolute inset-0 bg-blue-500 blur-[100px] opacity-20"></div>
                                <div className="relative glass p-10 rounded-2xl border border-blue-500/30">
                                    <h3 className="text-xl font-bold mb-4">Nuestra Filosofía</h3>
                                    <p className="text-slate-400 italic italic tracking-tight leading-relaxed">
                                        "Eliminar la burocracia digital. Si un proceso tarda más de tres clics, no es eficiente. wilkIA es el resultado de simplificar lo complejo."
                                    </p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* CONTACTO */}
                    <section id="contacto" className="w-full max-w-4xl px-6 py-24 border-t border-white/5">
                        <div className="bg-[#1e293b] rounded-[2rem] p-8 md:p-16 shadow-2xl border border-white/5 relative overflow-hidden">
                            <div className="text-center mb-12">
                                <h2 className="text-4xl font-bold mb-4">¿Hablamos?</h2>
                                <p className="text-slate-400">Estamos listos para llevar tu gestión al siguiente nivel.</p>
                            </div>

                            <form action="https://formspree.io/f/noreply.wilkia@gmail.com" method="POST" className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <input type="text" name="name" required className="bg-[#0f172a] border border-slate-700 rounded-xl p-4 focus:border-blue-400 outline-none" placeholder="Nombre completo" />
                                    <input type="email" name="email" required className="bg-[#0f172a] border border-slate-700 rounded-xl p-4 focus:border-blue-400 outline-none" placeholder="Email corporativo" />
                                </div>
                                <textarea name="message" rows="4" required className="w-full bg-[#0f172a] border border-slate-700 rounded-xl p-4 focus:border-blue-400 outline-none" placeholder="¿En qué podemos ayudarte?"></textarea>
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-5 rounded-xl transition-all shadow-lg text-lg uppercase tracking-widest">Enviar Solicitud</button>
                            </form>
                        </div>
                    </section>

                    <footer className="w-full py-12 border-t border-white/5 text-center text-slate-500 text-sm">
                        <div className="mb-4 text-blue-400 font-bold text-xl italic tracking-tighter">wilkIA</div>
                        &copy; 2026 wilkIA Cloud Solutions. Hecho para el éxito empresarial.
                    </footer>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
