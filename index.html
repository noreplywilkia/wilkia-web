<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Smart Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfdfe; color: #0f172a; scroll-behavior: smooth; overflow-x: hidden; }

        /* GRADIENT ORBS */
        .orb { position: absolute; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.35; animation: float 15s infinite alternate; }
        @keyframes float { from { transform: translate(0,0); } to { transform: translate(60px, 40px); } }

        /* REVEAL EFFECT */
        .reveal { opacity: 0; filter: blur(15px); transform: translateY(40px); transition: all 1s cubic-bezier(0.19, 1, 0.22, 1); }
        .reveal.visible { opacity: 1; filter: blur(0); transform: translateY(0); }

        .glass-nav { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(25px); border-bottom: 1px solid rgba(0,0,0,0.04); }
        
        .bento-card { 
            background: white; border-radius: 2.5rem; border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.02); transition: all 0.4s ease;
        }
        .bento-card:hover { transform: translateY(-8px); box-shadow: 0 40px 80px rgba(15, 23, 42, 0.08); }

        .btn-shiny {
            position: relative; overflow: hidden;
        }
        .btn-shiny::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg); transition: 0.6s;
        }
        .btn-shiny:hover::after { left: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';

        const ScrollReveal = ({ children, className = "", delay = 0 }) => {
            const domRef = useRef();
            const [isVisible, setVisible] = useState(false);
            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => { if (entry.isIntersecting) setTimeout(() => setVisible(true), delay); });
                }, { threshold: 0.1 });
                observer.observe(domRef.current);
                return () => observer.unobserve(domRef.current);
            }, [delay]);
            return <div ref={domRef} className={`reveal ${className} ${isVisible ? 'visible' : ''}`}>{children}</div>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('escandallo');

            return (
                <div className="relative">
                    {/* FONDO AMBIENT */}
                    <div className="orb w-[500px] h-[500px] bg-blue-200 top-[-100px] right-[-50px]"></div>
                    <div className="orb w-[400px] h-[400px] bg-indigo-100 bottom-[10%] left-[-100px]"></div>

                    {/* NAV REHECHO */}
                    <nav className="fixed w-full z-[100] glass-nav py-5 px-8">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                {/* He forzado las rutas relativas raiz ./ para GitHub */}
                                <img src="./logo.png" className="h-10 w-auto" alt="Logo" onError={(e) => e.target.src='https://via.placeholder.com/40?text=W'} />
                                <img src="./logo_nombre.png" className="h-6 w-auto" alt="wilkIA" onError={(e) => e.target.src='https://via.placeholder.com/100x20?text=wilkIA'} />
                            </div>
                            <div className="hidden md:flex items-center gap-10 font-bold text-[10px] uppercase tracking-[0.3em] text-slate-400">
                                <a href="#nosotros" className="hover:text-blue-600 transition-all">Nosotros</a>
                                <a href="#solucion" className="hover:text-blue-600 transition-all">Software</a>
                                <a href="#faq" className="hover:text-blue-600 transition-all">FAQ</a>
                                <a href="#contacto" className="btn-shiny bg-blue-600 text-white px-8 py-3 rounded-full shadow-xl shadow-blue-200">Acceso</a>
                            </div>
                        </div>
                    </nav>

                    {/* HERO (DISEÑO VITAMÍNICO) */}
                    <section className="pt-64 pb-32 px-6">
                        <ScrollReveal className="text-center max-w-5xl mx-auto">
                            <span className="text-blue-600 font-black uppercase tracking-[0.5em] text-[10px] mb-8 block italic">Management Intelligence</span>
                            <h1 className="text-7xl md:text-[110px] font-black tracking-tighter leading-[0.8] mb-12 text-slate-900">
                                Rentabilidad <br/>sin <span className="text-blue-600 italic text-shadow-xl">puntos ciegos.</span>
                            </h1>
                            <p className="text-slate-500 text-xl md:text-2xl max-w-2xl mx-auto font-medium leading-relaxed mb-12">
                                La herramienta que traduce tu operativa en márgenes de beneficio reales.
                            </p>
                        </ScrollReveal>

                        {/* MOCKUP DINÁMICO */}
                        <ScrollReveal delay={200} id="solucion" className="max-w-6xl mx-auto mt-24 bento-card flex flex-col md:flex-row h-[700px] overflow-hidden">
                            <div className="w-full md:w-80 bg-slate-50/50 border-r border-slate-100 p-10 flex flex-col gap-3">
                                {['Escandallo', 'Articulos', 'Marca', 'Formatos'].map((m) => (
                                    <button 
                                        key={m} 
                                        onClick={() => setActiveTab(m.toLowerCase())}
                                        className={`w-full text-left px-8 py-5 rounded-2xl font-black text-sm transition-all ${activeTab === m.toLowerCase() ? 'bg-white text-blue-600 shadow-xl scale-105' : 'text-slate-400 hover:text-slate-600'}`}
                                    >
                                        {m}
                                    </button>
                                ))}
                            </div>
                            <div className="flex-1 bg-white p-12 flex items-center justify-center">
                                <img src={`./images/${activeTab}.png`} className="max-w-full max-h-full rounded-2xl shadow-2xl transition-all duration-700" alt="Preview App" />
                            </div>
                        </ScrollReveal>
                    </section>

                    {/* QUIÉNES SOMOS */}
                    <section id="nosotros" className="py-40 px-6 max-w-5xl mx-auto">
                        <ScrollReveal className="grid lg:grid-cols-2 gap-20 items-center">
                            <h2 className="text-6xl font-black italic tracking-tighter leading-none">Más que <br/><span className="text-blue-600">algoritmos.</span></h2>
                            <div className="space-y-6">
                                <p className="text-slate-500 text-xl font-medium leading-relaxed">
                                    En wilkIA somos consultores que programan. Entendemos el dolor de los márgenes ajustados porque venimos de ahí.
                                </p>
                                <p className="text-slate-400 text-lg leading-relaxed">
                                    Nuestra misión es que cada decisión que tomes en tu negocio esté respaldada por datos precisos, no por intuiciones.
                                </p>
                            </div>
                        </ScrollReveal>
                    </section>

                    {/* FAQ */}
                    <section id="faq" className="py-40 px-6 bg-slate-50/30">
                        <div className="max-w-4xl mx-auto">
                            <h2 className="text-5xl font-black mb-20 text-center tracking-tight italic text-slate-900">FAQ</h2>
                            <div className="space-y-4">
                                {[
                                    {q: "¿Es compatible con mis sistemas?", a: "wilkIA está diseñado para convivir con cualquier ERP o software de ventas mediante importaciones inteligentes."},
                                    {q: "¿Qué tiempo de aprendizaje requiere?", a: "Nuestra interfaz es 'zero-learning'. Si sabes usar una hoja de cálculo, sabes usar wilkIA."},
                                    {q: "¿Los datos están en la nube?", a: "Sí, con servidores de máxima seguridad en Europa, cumpliendo con toda la normativa RGPD."}
                                ].map((item, i) => (
                                    <ScrollReveal key={i} delay={i*100} className="bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-sm">
                                        <h4 className="text-xl font-black mb-4 text-slate-800">{item.q}</h4>
                                        <p className="text-slate-500 text-lg font-medium">{item.a}</p>
                                    </ScrollReveal>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* CONTACTO (DARK MODE IMPACT) */}
                    <section id="contacto" className="py-40 px-6">
                        <div className="max-w-7xl mx-auto bg-slate-900 rounded-[4rem] p-12 md:p-24 relative overflow-hidden">
                            <div className="absolute -top-24 -right-24 w-96 h-96 bg-blue-600 blur-[150px] opacity-30"></div>
                            <ScrollReveal className="grid lg:grid-cols-2 gap-20 relative z-10">
                                <div>
                                    <h2 className="text-7xl font-black text-white leading-none tracking-tighter mb-10 italic">
                                        Escala tu <br/><span className="text-blue-500">visión.</span>
                                    </h2>
                                    <p className="text-slate-400 text-xl font-medium">Estamos listos para auditar tu rentabilidad. Déjanos tus datos y nos vemos en el dashboard.</p>
                                </div>
                                <form action="https://formspree.io/f/noreply.wilkia@gmail.com" method="POST" className="space-y-6">
                                    <input name="name" placeholder="Nombre" className="w-full bg-white/5 border border-white/10 p-6 rounded-3xl text-white outline-none focus:border-blue-500 transition-all" required />
                                    <input name="email" type="email" placeholder="Email corporativo" className="w-full bg-white/5 border border-white/10 p-6 rounded-3xl text-white outline-none focus:border-blue-500 transition-all" required />
                                    <textarea name="message" rows="3" placeholder="¿Cómo podemos ayudarte?" className="w-full bg-white/5 border border-white/10 p-6 rounded-3xl text-white outline-none focus:border-blue-500 transition-all"></textarea>
                                    <button className="btn-shiny w-full bg-blue-600 text-white p-7 rounded-3xl font-black uppercase tracking-widest shadow-2xl shadow-blue-600/30">Agendar Demo</button>
                                </form>
                            </ScrollReveal>
                        </div>
                    </section>

                    {/* FOOTER */}
                    <footer className="py-20 px-8 text-center bg-white border-t border-slate-50">
                        <div className="flex justify-center items-center gap-4 mb-12">
                            <img src="./logo.png" className="h-10 w-auto" alt="Logo" />
                            <img src="./logo_nombre.png" className="h-6 w-auto opacity-40" alt="wilkIA" />
                        </div>
                        <p className="text-slate-200 text-[10px] font-black uppercase tracking-[0.5em]">© 2026 WILKIA SYSTEMS — FUTURE-PROOF MANAGEMENT</p>
                    </footer>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
