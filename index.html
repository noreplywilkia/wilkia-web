<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #fcfcfd;
            color: #1a1a1a;
        }
        .header-blur {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #eee;
        }
        .feature-card {
            transition: all 0.3s ease;
            border: 1px solid #f0f0f0;
        }
        .feature-card:hover {
            border-color: #3b82f6;
            background: #f8faff;
        }
        .screenshot-shadow {
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';

        const App = () => {
            const [selectedTab, setSelectedTab] = useState(0);
            const features = [
                { id: 'escandallo', title: 'Escandallos', desc: 'Control total de costes por plato.' },
                { id: 'articulos', title: 'Artículos', desc: 'Gestión centralizada de stock.' },
                { id: 'formatos', title: 'Formatos', desc: 'Configuración flexible de venta.' },
                { id: 'marca', title: 'Métricas', desc: 'Analítica en tiempo real.' }
            ];

            return (
                <div className="min-h-screen">
                    {/* NAV */}
                    <nav className="fixed w-full z-50 header-blur px-6 py-4">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="text-2xl font-extrabold text-blue-600 tracking-tight">wilkIA</div>
                            <div className="hidden md:flex gap-10 font-semibold text-gray-500 text-sm">
                                <a href="#solucion" className="hover:text-blue-600">Software</a>
                                <a href="#nosotros" className="hover:text-blue-600">Nosotros</a>
                                <a href="#faq" className="hover:text-blue-600">Ayuda</a>
                            </div>
                            <a href="#contacto" className="bg-blue-600 text-white px-6 py-2.5 rounded-full font-bold text-sm shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all">Solicitar Demo</a>
                        </div>
                    </nav>

                    {/* HERO */}
                    <section className="pt-32 pb-20 px-6 text-center">
                        <span className="bg-blue-50 text-blue-600 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest">Nueva Era en Gestión</span>
                        <h1 className="text-5xl md:text-7xl font-extrabold mt-6 mb-8 text-gray-900 tracking-tight">
                            La gestión de tu negocio, <br/>
                            <span className="text-blue-600 underline decoration-blue-200 underline-offset-8">ahora es simple.</span>
                        </h1>
                        <p className="text-gray-500 text-xl max-w-2xl mx-auto mb-12">
                            Simplifica procesos, controla márgenes y toma decisiones basadas en datos reales con el software más intuitivo del mercado.
                        </p>
                    </section>

                    {/* SHOWCASE SECTON (Reemplaza el carrusel) */}
                    <section id="solucion" className="max-w-7xl mx-auto px-6 py-12">
                        <div className="bg-white rounded-[2rem] border border-gray-100 shadow-xl overflow-hidden md:flex">
                            {/* Selector lateral */}
                            <div className="md:w-1/3 bg-gray-50/50 p-8 flex flex-col gap-4 border-r border-gray-100">
                                {features.map((f, i) => (
                                    <button 
                                        key={f.id}
                                        onClick={() => setSelectedTab(i)}
                                        className={`text-left p-5 rounded-2xl transition-all ${selectedTab === i ? 'bg-white shadow-md border-l-4 border-blue-600' : 'hover:bg-gray-100'}`}
                                    >
                                        <h3 className={`font-bold ${selectedTab === i ? 'text-blue-600' : 'text-gray-700'}`}>{f.title}</h3>
                                        <p className="text-sm text-gray-500 mt-1">{f.desc}</p>
                                    </button>
                                ))}
                            </div>
                            {/* Imagen central */}
                            <div className="md:w-2/3 p-4 md:p-12 flex items-center justify-center bg-white">
                                <img 
                                    src={`/images/${features[selectedTab].id}.png`} 
                                    className="w-full h-auto rounded-xl screenshot-shadow border border-gray-100 transition-all duration-500"
                                    alt={features[selectedTab].title}
                                />
                            </div>
                        </div>
                    </section>

                    {/* NOSOTROS */}
                    <section id="nosotros" className="py-24 bg-gray-50">
                        <div className="max-w-5xl mx-auto px-6 grid md:grid-cols-2 gap-16 items-center">
                            <div>
                                <h2 className="text-3xl font-extrabold text-gray-900 mb-6">Expertos en digitalización de procesos</h2>
                                <p className="text-gray-600 text-lg leading-relaxed">
                                    wilkIA nace para eliminar el caos administrativo. No vendemos solo software, ofrecemos claridad mental para el empresario moderno.
                                </p>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                                    <p className="text-3xl font-black text-blue-600">100%</p>
                                    <p className="text-sm font-bold text-gray-400 mt-2 uppercase tracking-wide">Nube</p>
                                </div>
                                <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                                    <p className="text-3xl font-black text-blue-600">SaaS</p>
                                    <p className="text-sm font-bold text-gray-400 mt-2 uppercase tracking-wide">Modelo</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* CONTACTO */}
                    <section id="contacto" className="py-24 max-w-4xl mx-auto px-6">
                        <div className="bg-white rounded-[3rem] p-12 md:p-16 border border-gray-100 shadow-2xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-blue-50 rounded-bl-full -z-0"></div>
                            <div className="relative z-10">
                                <h2 className="text-4xl font-extrabold text-gray-900 mb-4 text-center">Cuéntanos tu proyecto</h2>
                                <p className="text-gray-500 text-center mb-12 italic">Respondemos personalmente en menos de 24 horas.</p>
                                <form action="https://formspree.io/f/noreply.wilkia@gmail.com" method="POST" className="space-y-4">
                                    <div className="grid md:grid-cols-2 gap-4">
                                        <input type="text" name="name" placeholder="Tu nombre" required className="w-full bg-gray-50 border-none p-4 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none" />
                                        <input type="email" name="email" placeholder="Tu email" required className="w-full bg-gray-50 border-none p-4 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none" />
                                    </div>
                                    <textarea name="message" placeholder="¿Cómo podemos ayudarte?" rows="4" className="w-full bg-gray-50 border-none p-4 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none"></textarea>
                                    <button className="w-full bg-blue-600 text-white py-5 rounded-2xl font-bold uppercase tracking-widest hover:bg-blue-700 shadow-xl shadow-blue-100 transition-all">Enviar Mensaje</button>
                                </form>
                            </div>
                        </div>
                    </section>

                    <footer className="py-12 text-center text-gray-400 text-xs font-semibold uppercase tracking-widest border-t border-gray-100">
                        &copy; 2026 wilkIA Cloud Solutions
                    </footer>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
