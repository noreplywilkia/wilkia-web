<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .demo-container { position: relative; height: 500px; display: flex; justify-content: center; align-items: center; }
        .demo-img { position: absolute; width: 600px; transition: all 0.5s ease; cursor: pointer; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-slate-950 text-white">
    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto">
        <div class="text-2xl font-bold text-blue-500">wilkIA</div>
        <div class="hidden md:flex gap-6 font-medium text-slate-300">
            <a href="#">Inicio</a><a href="#">Demo</a><a href="#">Contacto</a>
        </div>
    </nav>
    <header class="text-center py-12">
        <h1 class="text-5xl font-extrabold mb-4">Gestión profesional inteligente</h1>
        <p class="text-slate-400">Tu negocio en Jávea, bajo control.</p>
    </header>
    <section class="demo-container px-4">
        <img src="/images/articulos.png" class="demo-img z-50" style="left: 20%; top: 50px;" onclick="bringToFront(this)">
        <img src="/images/escandallo.png" class="demo-img z-40" style="left: 25%; top: 70px;" onclick="bringToFront(this)">
        <img src="/images/formatos.png" class="demo-img z-30" style="left: 30%; top: 90px;" onclick="bringToFront(this)">
    </section>
    <script>
        function bringToFront(el) {
            document.querySelectorAll('.demo-img').forEach(img => img.style.zIndex = '10');
            el.style.zIndex = '100';
            el.style.transform = 'scale(1.1)';
        }
    </script>
</body>
</html>
