<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Power Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f1f5f9;
            color: #0f172a;
        }
        .bg-pattern {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .bento-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bento-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1);
            border-color: #3b82f6;
        }
        .nav-pill {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="bg-pattern">
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';

        const Stat = ({ label, value }) => (
            <div className="flex flex-col">
                <span className="text-3xl font-black text-blue-600">{value}</span>
                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{label}</span>
            </div>
        );

        const App = () => {
            const [activeImg, setActiveImg] = useState('escandallo');
            const [openFaq, setOpenFaq] = useState(null);

            return (
                <div className="min-h-screen">
                    {/* NAV FLOTANTE */}
                    <nav className="fixed w-full z-50 top-4 px-6">
                        <div className="max-w-6xl mx-auto nav-pill rounded-2xl p-4 flex justify-between items-center shadow-sm">
                            <div className="text-2xl font-black tracking-tighter text-blue-600">wilkIA</div>
                            <div className="hidden md:flex gap-8 text-[11px] font-bold uppercase tracking-widest text-slate-500">
                                <a href="#caracteristicas" className="hover:text-blue-600">Funciones</a>
                                <a href="#nosotros" className="hover:text-blue-600">Sobre wilkIA</a>
                                <a href="#faq" className="hover:text-blue-600">Ayuda</a>
                            </div>
                            <button className="bg-slate-900 text-white px-5 py-2 rounded-xl text-[11px] font-bold uppercase tracking-widest hover:bg-blue-600 transition-all">Contacto</button>
                        </div>
                    </nav>

                    {/* HERO & MOCKUP SECTION */}
                    <section className="pt-32 pb-20 px-6">
                        <div className="max-w-6xl mx-auto grid lg:grid-cols-12 gap-12 items-center">
                            <div className="lg:col-span-5 text-left">
                                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-100 text-blue-700 text-[10px] font-black uppercase mb-6">
                                    <span className="relative flex h-2 w-2">
                                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                                        <span className="relative inline-flex rounded-full h-2 w-2 bg-blue-600"></span>
                                    </span>
                                    Sistema Operativo Empresarial
                                </div>
                                <h1 className="text-5xl md:text-7xl font-black leading-[1.1] mb-6 tracking-tighter">
                                    Controla <br/><span className="text-blue-600">cada céntimo.</span>
                                </h1 >
                                <p className="text-slate-500 text-lg mb-8 leading-relaxed">
                                    Mucho más que un Excel avanzado. wilkIA es el motor que automatiza tus costes, stocks y ventas en una sola interfaz.
                                </p>
                                <div className="flex gap-8 border-t border-slate-200 pt-8">
                                    <Stat label="Eficiencia" value="+40%" />
                                    <Stat label="Tiempo Ahorrado" value="12h/sem" />
                                    <Stat label="Precisión" value="99.9%" />
                                </div>
                            </div>
                            
                            <div className="lg:col-span-7 relative group">
                                <div className="absolute -inset-4 bg-gradient-to-tr from-blue-400 to-indigo-400 opacity-20 blur-3xl rounded-full"></div>
                                <div className="relative bento-card overflow-hidden shadow-2xl border-4 border-white">
                                    <div className="bg-slate-50 px-4 py-2 border-b border-slate-200 flex items-center justify-between">
                                        <div className="flex gap-1.5">
                                            <div className="w-2.5 h-2.5 rounded-full bg-slate-300"></div>
                                            <div className="w-2.5 h-2.5 rounded-full bg-slate-300"></div>
                                            <div className="w-2.5 h-2.5 rounded-full bg-slate-300"></div>
                                        </div>
                                        <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">wilkIA_v2.6_cloud</div>
                                    </div>
                                    <img src={`/images/${activeImg}.png`} className="w-full h-auto" />
                                </div>
                                {/* Mini selectores */}
                                <div className="absolute -bottom-6 left-1/2 -translate-x-1/2 flex gap-2 bg-white p-2 rounded-2xl shadow-xl border border-slate-100">
                                    {['escandallo', 'articulos', 'marca', 'formatos'].map(img => (
                                        <button 
                                            key={img}
                                            onClick={() => setActiveImg(img)}
                                            className={`w-12 h-12 rounded-lg overflow-hidden border-2 transition-all ${activeImg === img ? 'border-blue-600 scale-110' : 'border-transparent opacity-50'}`}
                                        >
                                            <img src={`/images/${img}.png`} className="object-cover h-full w-full" />
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* BENTO GRID DE FUNCIONES (LLENA EL ESPACIO VACÍO) */}
                    <section id="caracteristicas" className="max-w-6xl mx-auto px-6 py-20">
                        <div className="grid md:grid-cols-3 gap-6">
                            <div className="md:col-span-2 bento-card p-10 flex flex-col justify-end min-h-[300px] bg-slate-900 text-white overflow-hidden relative group">
                                <div className="absolute top-0 right-0 p-10 opacity-10 group-hover:scale-110 transition-transform">
                                    <svg width="200" height="200" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                                </div>
                                <h3 className="text-3xl font-bold mb-4 italic">Inteligencia de Datos</h3>
                                <p className="text-slate-400 max-w-md italic">No más suposiciones. wilkIA analiza tus compras pasadas para predecir tus gastos futuros y ajustar tus precios automáticamente.</p>
                            </div>
                            <div className="bento-card p-10 flex flex-col justify-center text-center">
                                <div className="text-5xl mb-4">🚀</div>
                                <h3 className="font-black uppercase tracking-tighter text-xl">Cloud Sync</h3>
                                <p className="text-slate-500 text-sm mt-2">Acceso instantáneo desde cualquier lugar del mundo.</p>
                            </div>
                            <div className="bento-card p-10 flex flex-col justify-center">
                                <h3 className="font-black uppercase tracking-tighter text-xl mb-2">Escandallos Pro</h3>
                                <p className="text-slate-500 text-sm">Calcula el margen real descontando mermas y costes indirectos.</p>
                            </div>
                            <div className="md:col-span-2 bento-card p-10 flex items-center gap-8 bg-blue-600 text-white">
                                <div className="text-4xl">🔒</div>
                                <div>
                                    <h3 className="text-2xl font-black uppercase tracking-tighter">Seguridad de Grado Militar</h3>
                                    <p className="text-blue-100 text-sm">Tus datos financieros están cifrados y protegidos por protocolos bancarios.</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* NOSOTROS - HISTORIA */}
                    <section id="nosotros" className="py-24 max-w-5xl mx-auto px-6 text-center">
                        <h2 className="text-4xl font-black mb-8 italic tracking-tighter">EL EQUIPO DETRÁS DE LA IA</h2>
                        <p className="text-xl text-slate-600 leading-relaxed max-w-3xl mx-auto">
                            Nacimos en el sector de la consultoría operativa. Después de ver a cientos de empresarios sufrir con el descontrol de sus datos, decidimos crear la herramienta definitiva. <strong>wilkIA</strong> no es solo código; es conocimiento de negocio aplicado.
                        </p>
                    </section>

                    {/* FAQ - DISEÑO LISTA */}
                    <section id="faq" className="py-20 max-w-3xl mx-auto px-6">
                        <h2 className="text-2xl font-black mb-10 uppercase tracking-widest text-center">Centro de Ayuda</h2>
                        <div className="space-y-4">
                            {[
                                {q: "¿Cómo empiezo?", a: "Es tan fácil como subir tu lista de artículos. Nosotros nos encargamos de configurar los escandallos contigo."},
                                {q: "¿Es compatible con mi TPV?", a: "Sí, wilkIA se integra vía API con los principales sistemas de punto de venta del mercado."},
                                {q: "¿Qué pasa si necesito ayuda?", a: "Nuestro soporte está disponible 24/7 vía chat y teléfono para todos nuestros clientes."}
                            ].map((item, idx) => (
                                <div key={idx} className="bento-card !rounded-2xl p-6 cursor-pointer" onClick={() => setOpenFaq(openFaq === idx ? null : idx)}>
                                    <div className="flex justify-between items-center font-bold">
                                        <span>{item.q}</span>
                                        <span className="text-blue-600">{openFaq === idx ? '−' : '+'}</span>
                                    </div>
                                    {openFaq === idx && <p className="mt-4 text-slate-500 text-sm leading-relaxed border-t pt-4">{item.a}</p>}
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* FORMULARIO - DISEÑO CAJA COMPACTA */}
                    <section id="contacto" className="py-24 px-6 bg-slate-900">
                        <div className="max-w-4xl mx-auto text-white">
                            <div className="grid md:grid-cols-2 gap-12">
                                <div>
                                    <h2 className="text-5xl font-black tracking-tighter mb-6 italic">¿LISTO PARA <span className="text-blue-500">DESPEGAR?</span></h2>
                                    <p className="text-slate-400">Solicita una demo personalizada y deja que te mostremos cómo wilkIA puede ahorrarte miles de euros al año.</p>
                                    <div className="mt-8 text-blue-400 font-bold">noreply.wilkia@gmail.com</div>
                                </div>
                                <form action="https://formspree.io/f/noreply.wilkia@gmail.com" method="POST" className="space-y-4">
                                    <input name="name" placeholder="Nombre" className="w-full bg-slate-800 border border-slate-700 p-4 rounded-xl outline-none focus:border-blue-500" />
                                    <input name="email" type="email" placeholder="Email" className="w-full bg-slate-800 border border-slate-700 p-4 rounded-xl outline-none focus:border-blue-500" />
                                    <textarea name="message" placeholder="Tu proyecto" className="w-full bg-slate-800 border border-slate-700 p-4 rounded-xl outline-none focus:border-blue-500" rows="3"></textarea>
                                    <button className="w-full bg-blue-600 p-4 rounded-xl font-black uppercase tracking-widest hover:bg-blue-500 transition-all">Solicitar Información</button>
                                </form>
                            </div>
                        </div>
                    </section>

                    <footer className="py-12 text-center text-slate-400 text-[10px] font-bold uppercase tracking-[0.5em]">
                        &copy; 2026 wilkIA Cloud / Engineering Success
                    </footer>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
