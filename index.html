<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.7"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/": "https://esm.sh/react-dom@18.3.1/",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
</head>
<body class="bg-[#0f172a] text-white">
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';

        function App() {
            const [zIndex, setZIndex] = useState([10, 20, 30, 40, 50]);

            const moveFront = (index) => {
                const max = Math.max(...zIndex);
                const newZ = [...zIndex];
                newZ[index] = max + 1;
                setZIndex(newZ);
            };

            const images = ['articulos', 'escandallo', 'formatos', 'formatos2', 'marca'];

            return (
                <div className="min-h-screen">
                    <nav className="flex items-center justify-between p-8 border-b border-white/5">
                        <div className="text-2xl font-bold text-blue-400">wilkIA</div>
                        <div className="flex gap-8 text-sm font-medium text-slate-300">
                            {['Inicio', 'Demo', 'Quienes Somos', 'Contacto'].map(item => 
                                <a href="#" key={item} className="hover:text-blue-400 transition-colors">{item}</a>
                            )}
                        </div>
                    </nav>

                    <main className="container mx-auto px-6 py-20 text-center">
                        <h1 className="text-5xl font-extrabold mb-6">Gestión profesional</h1>
                        <p className="text-slate-400 mb-24">Control total para tu negocio en Jávea</p>

                        {/* Contenedor de pantallas - Centrado y con perspectiva */}
                        <div className="relative h-[450px] w-full max-w-4xl mx-auto">
                            {images.map((img, i) => (
                                <div 
                                    key={img}
                                    onClick={() => moveFront(i)}
                                    className="absolute cursor-pointer transition-all duration-500 hover:-translate-y-4"
                                    style={{ 
                                        left: `${i * 80}px`, 
                                        top: `${i * 30}px`, 
                                        zIndex: zIndex[i] 
                                    }}
                                >
                                    <img 
                                        src={`/images/${img}.png`} 
                                        alt={img}
                                        className="w-[600px] h-auto rounded-xl shadow-2xl border border-white/10"
                                        onError={(e) => e.target.src = 'https://via.placeholder.com/600x400?text=Imagen+No+Encontrada'}
                                    />
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
