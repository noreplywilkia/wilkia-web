<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión Inteligente de Negocios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; scroll-behavior: smooth; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .app-container { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 50px 100px -20px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; overflow: hidden; }
        .sidebar-item { border-left: 3px solid transparent; transition: all 0.2s; }
        .sidebar-item.active { background: #eff6ff; border-left-color: #2563eb; color: #2563eb; }
        .input-field { background: #f1f5f9; border: 2px solid transparent; transition: all 0.3s; }
        .input-field:focus { background: white; border-color: #3b82f6; outline: none; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';

        const App = () => {
            const [activeTab, setActiveTab] = useState('escandallo');
            const [openFaq, setOpenFaq] = useState(null);

            const sections = [
                { id: 'escandallo', name: 'Escandallos Pro', icon: '📊' },
                { id: 'articulos', name: 'Control Stock', icon: '📦' },
                { id: 'marca', name: 'Dashboard IA', icon: '⚡' },
                { id: 'formatos', name: 'Ventas/Formatos', icon: '🛒' }
            ];

            return (
                <div className="min-h-screen">
                    {/* NAV */}
                    <nav className="fixed w-full z-50 glass-nav py-4 px-6">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <img src="/images/logo.png" className="h-10" alt="wilkIA Logo" />
                                <img src="/images/logo_nombre.png" className="h-6" alt="wilkIA" />
                            </div>
                            <div className="hidden md:flex gap-10 font-bold text-xs uppercase tracking-widest text-slate-500">
                                <a href="#solucion" className="hover:text-blue-600 transition-colors">Solución</a>
                                <a href="#faq" className="hover:text-blue-600 transition-colors">FAQ</a>
                                <a href="#contacto" className="text-blue-600">Contacto</a>
                            </div>
                        </div>
                    </nav>

                    {/* HERO */}
                    <section className="pt-40 pb-20 px-6 text-center">
                        <h1 className="text-5xl md:text-8xl font-black tracking-tighter mb-6 leading-none">
                            Tu negocio, <br/><span className="text-blue-600">bajo control.</span>
                        </h1>
                        <p className="text-slate-500 text-lg max-w-2xl mx-auto mb-16">
                            La plataforma definitiva para gestionar costes, inventarios y márgenes con inteligencia artificial.
                        </p>

                        {/* APP VIEWER "BROWSER STYLE" */}
                        <div id="solucion" className="max-w-6xl mx-auto app-container flex flex-col md:flex-row h-[600px]">
                            {/* Sidebar del "App" */}
                            <div className="w-full md:w-64 bg-slate-50 border-r border-slate-200 flex flex-col p-4 gap-2">
                                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4 px-4">Módulos wilkIA</div>
                                {sections.map(s => (
                                    <button 
                                        key={s.id}
                                        onClick={() => setActiveTab(s.id)}
                                        className={`sidebar-item flex items-center gap-3 p-4 rounded-xl font-bold text-sm ${activeTab === s.id ? 'active' : 'text-slate-600 hover:bg-slate-100'}`}
                                    >
                                        <span>{s.icon}</span> {s.name}
                                    </button>
                                ))}
                            </div>
                            {/* Área de Imagen */}
                            <div className="flex-1 bg-white p-6 overflow-hidden flex items-center justify-center">
                                <img 
                                    src={`/images/${activeTab}.png`} 
                                    className="max-w-full max-h-full rounded-lg shadow-lg border border-slate-100 object-contain"
                                    alt="Vista de wilkIA"
                                />
                            </div>
                        </div>
                    </section>

                    {/* FAQ */}
                    <section id="faq" className="py-24 max-w-4xl mx-auto px-6">
                        <h2 className="text-3xl font-black text-center mb-12 italic tracking-tighter">Dudas Frecuentes</h2>
                        <div className="grid md:grid-cols-2 gap-4">
                            {[
                                {q: "¿Cómo es el proceso de alta?", a: "Te asignamos un consultor que te ayudará a importar tus datos y dejar el sistema listo en 48h."},
                                {q: "¿Puedo cancelar cuando quiera?", a: "Sí, wilkIA funciona por suscripción mensual sin ningún tipo de permanencia oculta."},
                                {q: "¿Los datos están seguros?", a: "Utilizamos cifrado AES-256, el mismo estándar que utiliza la banca online."},
                                {q: "¿Hay formación para mi equipo?", a: "Incluimos sesiones de formación inicial y acceso a vídeotutoriales ilimitados."}
                            ].map((item, idx) => (
                                <div key={idx} className="p-6 bg-white rounded-2xl border border-slate-100 hover:shadow-md transition-shadow">
                                    <h4 className="font-bold mb-3 text-blue-600"># {item.q}</h4>
                                    <p className="text-sm text-slate-600 leading-relaxed">{item.a}</p>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* CONTACTO VITAMINADO */}
                    <section id="contacto" className="py-24 px-6 bg-slate-900 relative overflow-hidden">
                        <div className="absolute left-0 bottom-0 w-full h-1 bg-gradient-to-r from-blue-600 via-indigo-500 to-cyan-400"></div>
                        <div className="max-w-6xl mx-auto">
                            <div className="grid lg:grid-cols-2 gap-20">
                                <div>
                                    <h2 className="text-5xl font-black text-white tracking-tighter mb-8 leading-none">Solicita una <br/><span className="text-blue-500">demo en vivo.</span></h2>
                                    <p className="text-slate-400 text-lg mb-10 leading-relaxed">Analizaremos tu caso particular y te mostraremos cómo wilkIA puede optimizar tus procesos actuales.</p>
                                    
                                    <div className="space-y-6">
                                        <div className="flex items-center gap-4 text-white font-bold">
                                            <div className="w-12 h-12 rounded-full bg-blue-600/20 flex items-center justify-center text-blue-500 text-xl">✓</div>
                                            Estudio de márgenes gratuito
                                        </div>
                                        <div className="flex items-center gap-4 text-white font-bold">
                                            <div className="w-12 h-12 rounded-full bg-blue-600/20 flex items-center justify-center text-blue-500 text-xl">✓</div>
                                            Plan de implementación personalizado
                                        </div>
                                    </div>
                                </div>

                                <form action="https://formspree.io/f/noreply.wilkia@gmail.com" method="POST" className="bg-white p-8 md:p-10 rounded-[2rem] shadow-2xl">
                                    <div className="grid md:grid-cols-2 gap-4 mb-4">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Nombre Completo</label>
                                            <input name="name" required className="w-full input-field p-4 rounded-xl text-sm" placeholder="Ej. Juan Pérez" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Email Empresa</label>
                                            <input name="email" type="email" required className="w-full input-field p-4 rounded-xl text-sm" placeholder="juan@empresa.com" />
                                        </div>
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-4 mb-4">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Teléfono</label>
                                            <input name="phone" type="tel" className="w-full input-field p-4 rounded-xl text-sm" placeholder="+34 600 000 000" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Sector</label>
                                            <select name="sector" className="w-full input-field p-4 rounded-xl text-sm appearance-none">
                                                <option>Hostelería</option>
                                                <option>Retail / Comercio</option>
                                                <option>Industria</option>
                                                <option>Otros</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="space-y-2 mb-6">
                                        <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Mensaje / Necesidades</label>
                                        <textarea name="message" rows="3" className="w-full input-field p-4 rounded-xl text-sm" placeholder="¿Qué quieres mejorar en tu gestión?"></textarea>
                                    </div>
                                    <button className="w-full bg-blue-600 hover:bg-blue-700 text-white p-5 rounded-xl font-black uppercase tracking-widest shadow-lg shadow-blue-200 transition-all active:scale-[0.98]">
                                        Agendar Demo Gratuita
                                    </button>
                                </form>
                            </div>
                        </div>
                    </section>

                    {/* FOOTER REVISADO */}
                    <footer className="bg-white border-t border-slate-100 py-16 px-6">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start gap-12">
                            <div className="space-y-6">
                                <div className="flex items-center gap-3">
                                    <img src="/images/logo.png" className="h-8" alt="Logo" />
                                    <img src="/images/logo_nombre.png" className="h-5" alt="Nombre Logo" />
                                </div>
                                <p className="text-slate-400 text-sm max-w-xs leading-relaxed">
                                    Ingeniería de gestión aplicada para los negocios del futuro. Simple, potente y escalable.
                                </p>
                            </div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-12">
                                <div>
                                    <h5 className="font-bold text-xs uppercase tracking-tighter mb-4">Producto</h5>
                                    <ul className="text-slate-500 text-sm space-y-2">
                                        <li>Escandallos</li>
                                        <li>Dashboard</li>
                                        <li>Integraciones</li>
                                    </ul>
                                </div>
                                <div>
                                    <h5 className="font-bold text-xs uppercase tracking-tighter mb-4">Empresa</h5>
                                    <ul className="text-slate-500 text-sm space-y-2">
                                        <li>Sobre wilkIA</li>
                                        <li>Contacto</li>
                                        <li>Privacidad</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto mt-16 pt-8 border-t border-slate-50 text-center">
                            <span className="text-[10px] font-bold text-slate-300 uppercase tracking-[0.4em]">&copy; 2026 wilkIA Cloud System</span>
                        </div>
                    </footer>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
