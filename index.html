<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.7"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
</head>
<body class="bg-[#0f172a] text-white overflow-hidden">
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';

        function App() {
            const images = ['articulos', 'escandallo', 'formatos', 'formatos2', 'marca'];
            const [activeIndex, setActiveIndex] = useState(2);

            return (
                <div className="h-screen flex flex-col">
                    <nav className="p-6 flex justify-between items-center w-full">
                        <div className="text-2xl font-bold text-blue-400 italic">wilkIA</div>
                    </nav>

                    <div className="flex-grow flex items-center justify-center relative w-full pt-10">
                        {images.map((img, i) => {
                            const isActive = i === activeIndex;
                            const isPrev = i < activeIndex;
                            const isNext = i > activeIndex;

                            return (
                                <div 
                                    key={img}
                                    onClick={() => setActiveIndex(i)}
                                    className={`absolute transition-all duration-500 ease-out cursor-pointer flex justify-center items-center
                                        ${isActive ? 'z-30 scale-100 opacity-100' : 'z-10 scale-[0.4] md:scale-[0.6] opacity-40 hover:opacity-70'}
                                    `}
                                    style={{
                                        transform: isActive ? 'translateX(0px)' : `translateX(${(i - activeIndex) * (window.innerWidth < 768 ? 150 : 350)}px)`
                                    }}
                                >
                                    <img 
                                        src={`/images/${img}.png`} 
                                        alt={img}
                                        className="w-[300px] md:w-[800px] rounded-xl shadow-2xl border border-white/10 bg-[#1e293b]"
                                    />
                                </div>
                            );
                        })}
                    </div>

                    <p className="pb-10 text-center text-slate-500 text-xs uppercase tracking-widest">
                        Toca las lateralas para navegar
                    </p>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
