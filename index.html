<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA - Software de Gestión</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.7"></script>
    <style>
        .gradient-text { background: linear-gradient(135deg, #60A5FA 0%, #A78BFA 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/": "https://esm.sh/react-dom@18.3.1/",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "lucide-react": "https://esm.sh/lucide-react@0.474.0?external=react"
        }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import { BarChart3, Clock, LayoutDashboard, ShieldCheck, ArrowRight, Zap, ChevronRight } from 'lucide-react';

        function App() {
            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 font-sans">
                    {/* Header */}
                    <nav className="flex items-center justify-between p-8 max-w-7xl mx-auto">
                        <span className="text-2xl font-black text-white">wilk<span className="text-blue-500">IA</span></span>
                        <button className="bg-white/5 hover:bg-white/10 px-6 py-2 rounded-full font-medium transition">Acceso</button>
                    </nav>

                    {/* Hero */}
                    <section className="py-32 text-center px-6">
                        <h1 className="text-6xl md:text-9xl font-black tracking-tighter mb-8">Gestión al siguiente <br/><span className="gradient-text">nivel</span></h1>
                        <p className="text-xl text-slate-400 mb-10 max-w-lg mx-auto">Automatización inteligente para un mundo moderno.</p>
                        <button className="bg-blue-600 hover:bg-blue-500 px-8 py-4 rounded-full font-bold flex items-center gap-2 mx-auto">
                            Comenzar <ChevronRight size={18}/>
                        </button>
                    </section>

                    {/* Features */}
                    <section className="max-w-6xl mx-auto px-6 pb-32 grid md:grid-cols-2 gap-4">
                        {[
                            { t: 'Dashboard', d: 'Vista unificada' },
                            { t: 'Analítica', d: 'Datos predictivos' },
                            { t: 'Automatización', d: 'Procesos fluidos' },
                            { t: 'Seguridad', d: 'Enterprise-grade' }
                        ].map((f, i) => (
                            <div key={i} className="p-10 glass-card rounded-3xl hover:border-blue-500/50 transition">
                                <h3 className="text-3xl font-bold mb-2">{f.t}</h3>
                                <p className="text-slate-500">{f.d}</p>
                            </div>
                        ))}
                    </section>
                </div>
            );
        }

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
