<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Power Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #0f172a;
        }
        .bg-pattern {
            background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px);
            background-size: 40px 40px;
        }
        .bento-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-pill {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0,0,0,0.08);
        }
        .tab-active {
            border-color: #2563eb;
            background: #eff6ff;
            box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.15);
        }
    </style>
</head>
<body class="bg-pattern">
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';

        const App = () => {
            const [activeImg, setActiveImg] = useState('escandallo');
            const [openFaq, setOpenFaq] = useState(null);

            const screens = [
                { id: 'escandallo', name: 'Escandallos', desc: 'Control de márgenes' },
                { id: 'articulos', name: 'Artículos', desc: 'Gestión de inventario' },
                { id: 'marca', name: 'Métricas', desc: 'KPIs en tiempo real' },
                { id: 'formatos', name: 'Formatos', desc: 'Variantes de venta' }
            ];

            return (
                <div className="min-h-screen">
                    {/* NAV CON LOGO Y NOMBRE SEPARADOS */}
                    <nav className="fixed w-full z-50 top-4 px-6">
                        <div className="max-w-6xl mx-auto nav-pill rounded-2xl p-2.5 px-5 flex justify-between items-center shadow-lg">
                            <div className="flex items-center gap-2">
                                <img src="/images/logo.png" alt="Icono wilkIA" className="h-9 w-auto" />
                                <img src="/images/logo_nombre.png" alt="wilkIA" className="h-6 w-auto hidden sm:block" />
                            </div>
                            <div className="hidden md:flex gap-8 text-[10px] font-bold uppercase tracking-widest text-slate-500">
                                <a href="#caracteristicas" className="hover:text-blue-600 transition-colors">Funciones</a>
                                <a href="#nosotros" className="hover:text-blue-600 transition-colors">Nosotros</a>
                                <a href="#faq" className="hover:text-blue-600 transition-colors">FAQ</a>
                            </div>
                            <button className="bg-[#1e293b] text-white px-5 py-2 rounded-xl text-[11px] font-bold uppercase hover:bg-blue-600 transition-all shadow-md">Demo Gratis</button>
                        </div>
                    </nav>

                    {/* HERO */}
                    <section className="pt-44 pb-20 px-6">
                        <div className="max-w-6xl mx-auto grid lg:grid-cols-12 gap-16 items-center">
                            <div className="lg:col-span-5">
                                <div className="inline-block px-3 py-1 bg-blue-50 text-blue-600 text-[10px] font-black uppercase tracking-widest rounded-lg mb-6 italic">
                                    Management Intelligence
                                </div>
                                <h1 className="text-6xl md:text-7xl font-black leading-[0.95] mb-8 tracking-tighter text-slate-900">
                                    Toma el <br/><span className="text-blue-600">mando.</span>
                                </h1>
                                <p className="text-slate-500 text-lg mb-10 leading-relaxed">
                                    Visualiza la salud de tu negocio con la precisión que solo wilkIA puede ofrecerte. Menos administración, más resultados.
                                </p>
                                <div className="flex flex-wrap gap-4">
                                    <div className="px-6 py-4 bg-white rounded-3xl border border-slate-100 shadow-sm flex-1 min-w-[140px]">
                                        <span className="block text-3xl font-black text-slate-800">2.5x</span>
                                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Más rápido</span>
                                    </div>
                                    <div className="px-6 py-4 bg-white rounded-3xl border border-slate-100 shadow-sm flex-1 min-w-[140px]">
                                        <span className="block text-3xl font-black text-blue-600">Cloud</span>
                                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Acceso Total</span>
                                    </div>
                                </div>
                            </div>
                            
                            {/* VISUALIZADOR REFINADO */}
                            <div className="lg:col-span-7 space-y-6">
                                <div className="relative bento-card overflow-hidden shadow-[0_32px_64px_-16px_rgba(0,0,0,0.1)] border-8 border-white bg-white">
                                    <img src={`/images/${activeImg}.png`} className="w-full h-auto transition-opacity duration-300" />
                                </div>
                                
                                {/* TABS DE IMÁGENES */}
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    {screens.map(s => (
                                        <button 
                                            key={s.id}
                                            onClick={() => setActiveImg(s.id)}
                                            className={`p-4 rounded-2xl border-2 text-left transition-all group ${activeImg === s.id ? 'tab-active' : 'border-transparent bg-white/50 hover:bg-white'}`}
                                        >
                                            <div className="text-[11px] font-black uppercase text-slate-900 mb-1 group-hover:text-blue-600 transition-colors">{s.name}</div>
                                            <div className="text-[9px] text-slate-400 font-medium leading-none">{s.desc}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* FAQ */}
                    <section id="faq" className="py-24 max-w-3xl mx-auto px-6">
                        <h2 className="text-3xl font-black mb-12 text-center italic tracking-tighter">Preguntas Frecuentes</h2>
                        <div className="space-y-4">
                            {[
                                {q: "¿Necesito conocimientos técnicos?", a: "Para nada. wilkIA ha sido diseñado para ser intuitivo desde el minuto uno. Si sabes usar una tablet, sabes usar wilkIA."},
                                {q: "¿Dónde se guardan mis datos?", a: "Toda tu información se aloja en servidores de alta seguridad con copias de seguridad automáticas diarias."}
                            ].map((item, idx) => (
                                <div key={idx} className="bento-card !rounded-3xl p-7 cursor-pointer" onClick={() => setOpenFaq(openFaq === idx ? null : idx)}>
                                    <div className="flex justify-between items-center font-bold text-slate-800">
                                        <span>{item.q}</span>
                                        <div className={`w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center transition-transform ${openFaq === idx ? 'rotate-45 bg-blue-50 text-blue-600' : ''}`}>+</div>
                                    </div>
                                    {openFaq === idx && <p className="mt-5 text-slate-500 text-sm leading-relaxed border-t border-slate-50 pt-5">{item.a}</p>}
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* CONTACTO */}
                    <section id="contacto" className="py-24 px-6 bg-[#0f172a] overflow-hidden relative">
                        <div className="absolute top-0 right-0 w-96 h-96 bg-blue-600/10 blur-[120px] rounded-full"></div>
                        <div className="max-w-5xl mx-auto grid md:grid-cols-2 gap-16 text-white items-center relative z-10">
                            <div>
                                <img src="/images/logo_nombre.png" className="h-10 mb-8 brightness-0 invert" alt="Logo Footer" />
                                <h2 className="text-5xl font-black mb-6 tracking-tighter">Empieza la <br/>transformación.</h2>
                                <p className="text-slate-400 text-lg">Únete a los negocios que ya han dejado atrás el caos operativo.</p>
                            </div>
                            <form action="https://formspree.io/f/noreply.wilkia@gmail.com" method="POST" className="bg-white/5 p-8 rounded-[2.5rem] backdrop-blur-sm border border-white/10 space-y-4">
                                <input name="email" type="email" placeholder="Email corporativo" className="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-blue-500 focus:bg-white/10 transition-all" />
                                <textarea name="message" placeholder="Cuéntanos sobre tu negocio" className="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-blue-500 focus:bg-white/10 transition-all" rows="3"></textarea>
                                <button className="w-full bg-blue-600 p-5 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-500 transition-all shadow-xl shadow-blue-900/40">Enviar Mensaje</button>
                            </form>
                        </div>
                    </section>

                    <footer className="py-12 text-center text-slate-500 text-[9px] font-bold uppercase tracking-[0.6em]">
                        &copy; 2026 wilkIA Cloud / Powered by Intelligence
                    </footer>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
