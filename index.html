<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        html, body { 
            max-width: 100%; overflow-x: hidden; scroll-behavior: smooth;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617; color: white;
        }
        .glass-header { 
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bento-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4), rgba(15, 23, 42, 0.4));
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .bento-card:hover { border-color: rgba(59, 130, 246, 0.5); transform: translateY(-5px); }
        .hero-glow {
            background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.15) 0%, rgba(2, 6, 23, 0) 70%);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';

        const FAQItem = ({ q, a }) => {
            const [open, setOpen] = useState(false);
            return (
                <div className="mb-4">
                    <button onClick={() => setOpen(!open)} className="w-full flex justify-between items-center p-6 bento-card rounded-2xl text-left">
                        <span className="font-semibold">{q}</span>
                        <span className={`text-blue-500 transition-transform ${open ? 'rotate-45' : ''}`}>+</span>
                    </button>
                    {open && <div className="p-6 text-slate-400 bg-white/5 rounded-b-2xl border-x border-b border-white/5">{a}</div>}
                </div>
            );
        };

        function App() {
            return (
                <div className="min-h-screen">
                    {/* NAV FLOTANTE PREMIUM */}
                    <nav className="fixed w-full z-[100] top-6 px-4 flex justify-center">
                        <div className="max-w-4xl w-full flex items-center justify-between p-3 glass-header rounded-2xl px-6 shadow-2xl">
                            <div className="text-2xl font-black text-blue-500 italic tracking-tighter">wilkIA</div>
                            <div className="hidden md:flex gap-8 text-xs font-bold uppercase tracking-widest text-slate-300">
                                <a href="#" className="hover:text-blue-400 transition-all">Inicio</a>
                                <a href="#demo" className="hover:text-blue-400 transition-all">Demo</a>
                                <a href="#nosotros" className="hover:text-blue-400 transition-all">Nosotros</a>
                                <a href="#faq" className="hover:text-blue-400 transition-all">Dudas</a>
                            </div>
                            <a href="#contacto" className="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-xl text-xs font-black uppercase transition-all shadow-lg shadow-blue-600/20">Probar</a>
                        </div>
                    </nav>

                    {/* HERO SECTION */}
                    <section className="pt-48 pb-20 px-6 hero-glow relative">
                        <div className="max-w-6xl mx-auto text-center">
                            <h1 className="text-5xl md:text-8xl font-black mb-8 tracking-tighter">
                                TU NEGOCIO, <br/><span className="text-blue-600 italic">SIN LIMITES.</span>
                            </h1>
                            <p className="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto mb-16">
                                wilkIA unifica tus escandallos, inventario y métricas en una plataforma de alto rendimiento diseñada para crecer.
                            </p>
                        </div>

                        {/* VISUALIZACIÓN DE IMÁGENES REDISEÑADA */}
                        <div id="demo" className="max-w-6xl mx-auto px-4">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                                <div className="relative group">
                                    <div className="absolute -inset-1 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-[2.5rem] blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
                                    <div className="relative bg-slate-900 rounded-[2rem] overflow-hidden border border-white/10">
                                        <div className="p-3 bg-slate-800/50 flex gap-2 border-b border-white/5">
                                            <div className="w-3 h-3 rounded-full bg-red-500/50"></div>
                                            <div className="w-3 h-3 rounded-full bg-yellow-500/50"></div>
                                            <div className="w-3 h-3 rounded-full bg-green-500/50"></div>
                                        </div>
                                        <img src="/images/escandallo.png" className="w-full h-auto" alt="Escandallos" />
                                    </div>
                                </div>
                                <div className="space-y-6">
                                    <div className="bento-card p-8 rounded-[2rem]">
                                        <h3 className="text-2xl font-bold mb-4 text-blue-500 italic">Control de Escandallos</h3>
                                        <p className="text-slate-400 italic">Analiza costes, mermas y márgenes de beneficio con precisión quirúrgica.</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="overflow-hidden rounded-2xl border border-white/10">
                                            <img src="/images/articulos.png" className="w-full h-auto" />
                                        </div>
                                        <div className="overflow-hidden rounded-2xl border border-white/10">
                                            <img src="/images/marca.png" className="w-full h-auto" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* QUIÉNES SOMOS */}
                    <section id="nosotros" className="py-24 max-w-6xl mx-auto px-6">
                        <div className="grid md:grid-cols-2 gap-16 items-center">
                            <div>
                                <h2 className="text-4xl font-black mb-6 uppercase tracking-tighter italic text-blue-500">Quiénes Somos</h2>
                                <p className="text-slate-300 leading-relaxed text-lg">
                                    En wilkIA, creemos que el software de gestión no debería ser un dolor de cabeza. Hemos construido una herramienta que combina la potencia de la inteligencia aplicada con una interfaz que cualquier persona puede dominar en minutos.
                                </p>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="p-6 bento-card rounded-2xl text-center">
                                    <p className="text-3xl font-bold text-blue-500">100%</p>
                                    <p className="text-xs uppercase text-slate-500 mt-2 font-bold tracking-widest">Cloud</p>
                                </div>
                                <div className="p-6 bento-card rounded-2xl text-center">
                                    <p className="text-3xl font-bold text-blue-500">24/7</p>
                                    <p className="text-xs uppercase text-slate-500 mt-2 font-bold tracking-widest">Soporte</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* FAQ */}
                    <section id="faq" className="py-20 max-w-4xl mx-auto px-6">
                        <h2 className="text-3xl font-black mb-12 text-center italic uppercase">Dudas Comunes</h2>
                        <FAQItem q="¿Es seguro wilkIA?" a="Absolutamente. Utilizamos servidores de alta seguridad y cifrado SSL de 256 bits para proteger toda tu información operativa." />
                        <FAQItem q="¿Puedo importar mis datos?" a="Sí, soportamos importación masiva vía Excel y CSV para que no tengas que picar datos desde cero." />
                    </section>

                    {/* CONTACTO */}
                    <section id="contacto" className="py-24 px-6">
                        <div className="max-w-4xl mx-auto bento-card rounded-[3rem] p-8 md:p-16 border-t-2 border-blue-500/50">
                            <div className="text-center mb-12">
                                <h2 className="text-4xl font-black mb-4 italic">¿Hablamos?</h2>
                                <p className="text-slate-400">Envíanos un mensaje y te responderemos a <span className="text-blue-400 font-bold">noreply.wilkia@gmail.com</span></p>
                            </div>
                            <form action="https://formspree.io/f/noreply.wilkia@gmail.com" method="POST" className="space-y-4">
                                <div className="grid md:grid-cols-2 gap-4">
                                    <input name="name" placeholder="Tu Nombre" required className="w-full bg-slate-900 border border-white/10 p-4 rounded-xl focus:border-blue-500 outline-none" />
                                    <input name="email" type="email" placeholder="Tu Email" required className="w-full bg-slate-900 border border-white/10 p-4 rounded-xl focus:border-blue-500 outline-none" />
                                </div>
                                <textarea name="message" placeholder="¿En qué podemos ayudarte?" rows="4" className="w-full bg-slate-900 border border-white/10 p-4 rounded-xl focus:border-blue-500 outline-none"></textarea>
                                <button className="w-full bg-blue-600 hover:bg-blue-500 py-5 rounded-xl font-black uppercase tracking-[0.2em] shadow-xl shadow-blue-600/20 transition-all">Enviar a wilkIA</button>
                            </form>
                        </div>
                    </section>

                    <footer className="py-12 text-center text-slate-600 text-xs font-bold tracking-[0.4em] uppercase">
                        &copy; 2026 wilkIA Cloud / Software de Gestión Avanzada
                    </footer>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
