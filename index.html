<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Demo Interactivo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.7"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        /* PUNTO 1: Bloqueo de scroll lateral */
        html, body {
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .perspective-1000 { perspective: 1000px; }
    </style>
</head>
<body class="bg-[#0f172a] text-white">
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';

        function App() {
            const images = ['articulos', 'escandallo', 'formatos', 'formatos2', 'marca'];
            const [activeIndex, setActiveIndex] = useState(2);
            const [isMobile, setIsMobile] = useState(false);

            useEffect(() => {
                const checkMobile = () => setIsMobile(window.innerWidth < 768);
                checkMobile();
                window.addEventListener('resize', checkMobile);
                return () => window.removeEventListener('resize', checkMobile);
            }, []);

            return (
                <div className="min-h-screen flex flex-col items-center">
                    <nav className="w-full flex flex-col md:flex-row items-center justify-between p-6 md:p-8 gap-4">
                        <div className="text-3xl font-black text-blue-400 italic">wilkIA</div>
                        <div className="flex flex-wrap justify-center gap-4 md:gap-8 text-xs md:text-sm font-medium text-slate-300">
                            {['Inicio', 'Demo', 'Quienes Somos', 'Contacto'].map(item => 
                                <a href="#" key={item} className="hover:text-blue-400 transition-all">{item}</a>
                            )}
                        </div>
                    </nav>

                    <div className="flex-grow flex flex-col items-center justify-center w-full py-6">
                        <h1 className="text-3xl md:text-5xl font-extrabold mb-8 md:mb-16 text-center px-4">Experiencia wilkIA</h1>

                        {/* PUNTO 2: overflow-hidden añadido aquí abajo */}
                        <div className="relative flex items-center justify-center w-full h-[350px] md:h-[500px] perspective-1000 overflow-hidden">
                            {images.map((img, i) => {
                                const offset = i - activeIndex;
                                const isCenter = i === activeIndex;
                                const translateX = isMobile ? offset * 70 : offset * 350;

                                return (
                                    <div 
                                        key={img}
                                        onClick={() => setActiveIndex(i)}
                                        className={`absolute transition-all duration-700 ease-in-out cursor-pointer ${isCenter ? 'z-20 scale-100 opacity-100' : 'z-10 scale-75 opacity-40'}`}
                                        style={{
                                            transform: `translateX(${translateX}px) ${isCenter ? '' : 'rotateY(' + (offset > 0 ? -25 : 25) + 'deg)'}`,
                                            /* PUNTO 3: Ancho controlado para que no desborde */
                                            width: isMobile ? '70%' : 'auto'
                                        }}
                                    >
                                        <img 
                                            src={`/images/${img}.png`} 
                                            alt={img}
                                            className="w-full max-w-[800px] h-auto rounded-xl shadow-2xl border border-white/10 bg-[#1e293b]"
                                        />
                                    </div>
                                );
                            })}
                        </div>
                        
                        <p className="mt-12 text-slate-400 text-sm text-center px-6 italic">
                            {isMobile ? "Desliza o toca las pantallas laterales" : "Haz clic en las pantallas para navegar"}
                        </p>
                    </div>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
