<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilkIA | Gestión Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        html, body { 
            max-width: 100%; overflow-x: hidden; scroll-behavior: smooth;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1120;
            color: white;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Ocultar scrollbar pero mantener funcionalidad */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';

        const FAQItem = ({ question, answer }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="mb-4">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full flex justify-between items-center p-5 glass-card rounded-2xl text-left">
                        <span className="font-semibold">{question}</span>
                        <span className={`text-blue-400 transition-transform ${isOpen ? 'rotate-45' : ''}`}>+</span>
                    </button>
                    {isOpen && <div className="p-5 text-slate-400 bg-white/5 rounded-b-2xl border-x border-b border-white/5">{answer}</div>}
                </div>
            );
        };

        function App() {
            const screens = [
                { id: 'articulos', title: 'Gestión de Artículos' },
                { id: 'escandallo', title: 'Escandallos Pro' },
                { id: 'formatos', title: 'Formatos de Venta' },
                { id: 'marca', title: 'Panel de Control' }
            ];

            return (
                <div className="min-h-screen">
                    {/* NAV */}
                    <nav className="fixed w-full z-50 px-4 py-4 flex justify-center">
                        <div className="max-w-5xl w-full flex items-center justify-between p-3 glass-card rounded-2xl px-6">
                            <div className="text-xl font-black text-blue-400 italic tracking-tighter">wilkIA</div>
                            <div className="hidden md:flex gap-6 text-xs font-bold uppercase tracking-widest text-slate-400">
                                <a href="#demo" className="hover:text-blue-400 transition-all">Software</a>
                                <a href="#funcionalidades" className="hover:text-blue-400 transition-all">Funciones</a>
                                <a href="#faq" className="hover:text-blue-400 transition-all">FAQ</a>
                            </div>
                            <a href="#contacto" className="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-all">Demo</a>
                        </div>
                    </nav>

                    {/* HERO */}
                    <section className="pt-32 pb-16 px-6 text-center">
                        <h1 className="text-4xl md:text-7xl font-extrabold mb-6 tracking-tighter">
                            Software de gestión <br/> 
                            <span className="text-blue-500">sin fricciones.</span>
                        </h1>
                        <p className="text-slate-400 max-w-2xl mx-auto text-lg mb-12">
                            Visualiza tu negocio con claridad. Control total sobre tus costes y stock con una interfaz moderna y rápida.
                        </p>
                    </section>

                    {/* NUEVA SECCIÓN DE CAPTURAS (REEMPLAZA AL CARRUSEL) */}
                    <section id="demo" className="px-6 py-12 max-w-7xl mx-auto">
                        <div className="flex overflow-x-auto md:grid md:grid-cols-2 gap-6 no-scrollbar snap-x snap-mandatory">
                            {screens.map((screen) => (
                                <div key={screen.id} className="min-w-[85%] md:min-w-full snap-center group">
                                    <div className="glass-card rounded-3xl overflow-hidden border border-white/10 group-hover:border-blue-500/50 transition-all duration-500 shadow-2xl">
                                        <div className="p-4 border-b border-white/5 bg-white/5 flex justify-between items-center">
                                            <span className="text-xs font-bold text-slate-400 tracking-widest uppercase">{screen.title}</span>
                                            <div className="flex gap-1.5">
                                                <div className="w-2 h-2 rounded-full bg-red-500/50"></div>
                                                <div className="w-2 h-2 rounded-full bg-yellow-500/50"></div>
                                                <div className="w-2 h-2 rounded-full bg-green-500/50"></div>
                                            </div>
                                        </div>
                                        <img 
                                            src={`/images/${screen.id}.png`} 
                                            alt={screen.title}
                                            className="w-full h-auto grayscale-[20%] group-hover:grayscale-0 transition-all duration-700 transform group-hover:scale-[1.02]"
                                        />
                                    </div>
                                </div>
                            ))}
                        </div>
                        <p className="md:hidden text-center text-slate-500 text-xs mt-6 italic">← Desliza para ver más pantallas →</p>
                    </section>

                    {/* BENTO FUNCIONALIDADES */}
                    <section id="funcionalidades" className="py-24 max-w-6xl mx-auto px-6">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="md:col-span-2 p-10 glass-card rounded-[2.5rem]">
                                <h3 className="text-2xl font-bold mb-4 text-blue-400 italic">Escandallos Inteligentes</h3>
                                <p className="text-slate-400 leading-relaxed">Calcula costes reales de producción al instante. wilkIA te avisa si tus márgenes bajan de lo esperado debido a cambios de precios en proveedores.</p>
                            </div>
                            <div className="p-10 glass-card rounded-[2.5rem] bg-blue-600/10 border-blue-500/20">
                                <h3 className="text-2xl font-bold mb-4">Stock Real</h3>
                                <p className="text-slate-400">Control de inventario con alertas de rotura. No vuelvas a perder una venta por falta de producto.</p>
                            </div>
                        </div>
                    </section>

                    {/* FAQ */}
                    <section id="faq" className="py-20 max-w-3xl mx-auto px-6">
                        <h2 className="text-3xl font-bold mb-10 text-center uppercase tracking-tighter">Preguntas Frecuentes</h2>
                        <FAQItem question="¿Es difícil de configurar?" answer="Para nada. Es un software listo para usar. Te ayudamos con la carga inicial de tus datos." />
                        <FAQItem question="¿Funciona sin conexión?" answer="wilkIA requiere conexión para sincronizar datos en tiempo real, garantizando que siempre veas la info actualizada." />
                    </section>

                    {/* CONTACTO */}
                    <section id="contacto" className="py-24 px-6">
                        <div className="max-w-4xl mx-auto glass-card rounded-[3rem] p-8 md:p-16 border-t-2 border-blue-500/30">
                            <h2 className="text-3xl md:text-5xl font-black mb-8 text-center italic tracking-tighter">¿Empezamos hoy?</h2>
                            <form action="https://formspree.io/f/noreply.wilkia@gmail.com" method="POST" className="grid grid-cols-1 gap-4">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <input name="name" type="text" placeholder="Nombre" required className="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:border-blue-400 outline-none" />
                                    <input name="email" type="email" placeholder="Email corporativo" required className="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:border-blue-400 outline-none" />
                                </div>
                                <textarea name="message" placeholder="¿Cómo podemos ayudarte?" rows="4" className="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:border-blue-400 outline-none"></textarea>
                                <button className="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-black uppercase tracking-widest transition-all shadow-xl shadow-blue-600/20">Enviar Solicitud</button>
                            </form>
                        </div>
                    </section>

                    <footer className="py-12 text-center text-slate-600 border-t border-white/5 text-sm uppercase tracking-widest font-bold">
                        &copy; 2026 wilkIA Cloud Solutions
                    </footer>
                </div>
            );
        }
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
